name: Mindwtr
version: "26.9.12"
slug: mindwtr
panel_title: Mindwtr
panel_icon: "mdi:brain"
description: Mind mapping and task management. Choose a sync mode, the rest is automatic.
url: https://github.com/LeGitHubDeTai/ha_addons/tree/main/mindwtr
webui: http://[HOST]:[PORT:8080]/
image: ghcr.io/legithubdetai/ha_addons/mindwtr-{arch}
arch:
    - amd64
    - aarch64
startup: application
boot: auto
hassio_role: "default"
hassio_api: true
homeassistant_api: true
apparmor: true
ingress: true
ingress_port: 8080
backup_exclude:
    - "*.log*"
    - "supervisord.log*"
map:
    - config:rw
    - share:rw
ports:
    8787/tcp: null
    8080/tcp: 8080
ports_description:
    8787/tcp: Mindwtr Cloud sync server API (only used in "selfhosted" sync mode)
    8080/tcp: Mindwtr web interface
options:
    sync_mode: local
    cloud_tokens: ""
    cors_origin: ""
schema:
    sync_mode: list(local|selfhosted|webdav|dropbox)
    cloud_tokens: password?
    cors_origin: str?
