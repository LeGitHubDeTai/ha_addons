[supervisord]
user=root
nodaemon=true
loglevel=info
logfile_maxbytes=1000000
logfile_backups=1

[program:mindwtr-cloud]
command=/usr/local/bin/mindwtr-cloud-entrypoint bun run --filter mindwtr-cloud start -- --host 0.0.0.0 --port 8787
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx-runtime]
command=/bin/sh -c "if [ -f /docker-entrypoint.d/10-runtime-config.sh ]; then /docker-entrypoint.d/10-runtime-config.sh; fi && exec nginx -g 'daemon off;'"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
