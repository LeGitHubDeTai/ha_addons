[supervisord]
user=root
nodaemon=true
loglevel=info
logfile_maxbytes=1000000
logfile_backups=1

[program:mindwtr-cloud]
directory=/usr/share/mindwtr
command=/usr/local/bin/mindwtr-cloud-run
autostart=true
autorestart=true
startsecs=5
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; NOTE: env (MINDWTR_*) is inherited from mindwtr-entrypoint, which loads
; /data/options.json. Do NOT use an `environment=` line here: supervisord
; parses commas/quotes in tokens poorly and would corrupt multi-token values.

[program:nginx-runtime]
command=/bin/sh -c "if [ -f /docker-entrypoint.d/10-runtime-config.sh ]; then /docker-entrypoint.d/10-runtime-config.sh; fi && exec nginx -g 'daemon off;'"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
