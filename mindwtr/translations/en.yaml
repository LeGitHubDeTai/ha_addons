configuration:
  sync_mode:
    name: Sync mode
    description: >-
      local = no sync server, data stays in this browser (local folders only).
      selfhosted = start the built-in Mindwtr Cloud sync server (multi-device sync + REST API, requires a token below).
      webdav = no sync server; configure your WebDAV endpoint inside the app (Settings → Sync → WebDAV).
      dropbox = no sync server; Dropbox only works in the native desktop/mobile apps, not in this web view.
  cloud_tokens:
    name: Cloud tokens (selfhosted mode only)
    description: >-
      One or more sync tokens, comma-separated. Each token must be 20–512 characters
      (letters/numbers). Each distinct token gets its own private dataset, so several
      people can share one server without seeing each other's data. Devices that should
      sync together must use the same token. Generate one with:
      cat /dev/urandom | LC_ALL=C tr -dc 'a-zA-Z0-9' | fold -w 50 | head -n 1
  cors_origin:
    name: CORS origin (selfhosted, optional)
    description: >-
      Leave empty in almost all cases (same-origin sync via the web interface needs no CORS).
      Only set this if a browser on another machine talks DIRECTLY to port 8787:
      the exact PWA address including scheme and port, e.g. http://192.168.1.20:8080.
