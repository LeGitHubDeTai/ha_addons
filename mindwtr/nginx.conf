user  nginx;
worker_processes  auto;
error_log /dev/stderr info;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 200m;

    access_log /dev/stdout;

    server {
        listen 8080;
        server_name _;

        # Ingress path sent by the Home Assistant Supervisor,
        # e.g. /api/hassio_ingress/<session>. Empty on direct :8080 access.
        # The Supervisor strips this prefix before forwarding, so absolute
        # paths work inbound — but the PWA is built with absolute asset/API
        # paths (/assets/..., /v1/...) which the browser would resolve to the
        # domain root, escaping the Ingress prefix (404s + white page).
        # sub_filter below rewrites them back under the prefix (same proven
        # pattern as the isoman add-on). With direct access the replacements
        # are neutral ("/..." -> "/...").
        set $ingress_path $http_x_ingress_path;

        root /usr/share/nginx/html;
        index index.html;

        # HA add-on: frontend may talk to the cloud server either via the
        # same-origin /v1/ proxy below or directly at http://<host>:8787
        # (LAN IP). Hence connect-src must allow http/https/ws/wss, not only
        # self + localhost as upstream does.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' data: blob: file:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location /assets/ {
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' data: blob: file:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;

            # Rewrite absolute chunk/import URLs under the Ingress prefix.
            sub_filter_types application/javascript text/css application/json;
            sub_filter_once off;
            sub_filter '"/assets/' '"$ingress_path/assets/';
            sub_filter "'/assets/" "'$ingress_path/assets/";
            sub_filter '"/v1/' '"$ingress_path/v1/';
            sub_filter "'/v1/" "'$ingress_path/v1/";
            sub_filter '"/' '"$ingress_path/';
            sub_filter "'/" "'$ingress_path/";
        }

        location /v1/ {
            proxy_pass http://127.0.0.1:8787/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_cache off;
            proxy_buffering off;
            # Fail fast when the cloud server is disabled (local/webdav/dropbox modes).
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # Liveness/readiness via the web port (useful behind Ingress where
        # :8787 is not exposed). Returns 502 when the cloud server is disabled.
        location = /health {
            proxy_pass http://127.0.0.1:8787/health;
            proxy_cache off;
            access_log off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location = /ready {
            proxy_pass http://127.0.0.1:8787/ready;
            proxy_cache off;
            access_log off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location / {
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' data: blob: file:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;

            # Rewrite absolute paths (assets, manifest, sw.js, API calls)
            # under the Ingress prefix so the PWA works both via Ingress
            # and via direct :8080 access.
            sub_filter_types text/html text/css application/javascript application/json;
            sub_filter_once off;
            sub_filter 'href="/'  'href="$ingress_path/';
            sub_filter 'src="/'   'src="$ingress_path/';
            sub_filter 'action="/' 'action="$ingress_path/';
            sub_filter 'srcset="/' 'srcset="$ingress_path/';
            sub_filter 'url("/'   'url("$ingress_path/';
            sub_filter "url('/"   "url('$ingress_path/";
            sub_filter 'url(/'    'url($ingress_path/';
            sub_filter '"/assets/' '"$ingress_path/assets/';
            sub_filter "'/assets/" "'$ingress_path/assets/";
            sub_filter '"/v1/'    '"$ingress_path/v1/';
            sub_filter "'/v1/"    "'$ingress_path/v1/";
            sub_filter '"/'       '"$ingress_path/';
            sub_filter "'/"       "'$ingress_path/";
        }
    }
}
