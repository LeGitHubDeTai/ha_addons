    QUEUE_DIR: match(/share/.+|/media/.+)
    INTERFACE_PORT: port
    INTERFACE_BIND: str
    READ_PERMISSION: bool
    WRITE_PERMISSION: bool
    BANDWIDTH_MAX: int
    BANDWIDTH_UL: int
    BANDWIDTH_DL: int
    PAR_CHECK: bool
    PAR_REPAIR: bool
    DELETE_INCOMPLETE: bool
    KEEP_DAYS: int
    MAIL_ON_WARN: bool
