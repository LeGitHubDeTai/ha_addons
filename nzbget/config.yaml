      path: /share
    - type: media
      read_only: false
      path: /media
    - type: backup
      read_only: false
      path: /backup
environment:
    PUID: "0"
    PGID: "0"
    TZ: Europe/Paris
options:
    PUID: 0
    PGID: 0
    TZ: Europe/Paris
    DOWNLOAD_DIR: /share/nzbget/downloads
