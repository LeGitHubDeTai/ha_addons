name: NZBGet
version: "26.9.1"
slug: nzbget
description: Client de t�l�chargement Usenet (NZBGet) - Client NZB bas� sur le web avec une interface de contr�le distante
url: https://github.com/LeGitHubDeTai/ha_addons/tree/main/nzbget
webui: http://[HOST]:[PORT:6789]/
image: ghcr.io/legithubdetai/ha_addons/nzbget-{arch}
arch:
