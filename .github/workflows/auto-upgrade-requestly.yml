name: Auto-upgrade requestly

# Workflow to automatically upgrade requestly addon when new upstream app versions are available
on:
  schedule:
    # Run daily at 9:00 AM UTC
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force recreate PR even if one already exists (closed/merged)'
        required: false
        default: true
        type: boolean

jobs:
  auto-upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current versions
        id: current
        run: |
          DOCKERFILE_VERSION=$(grep -E 'ARG REQUESTLY_APP_VERSION' requestly/Dockerfile | head -1 | sed 's/.*=//' | sed 's/[[:space:]]*//')
          echo "dockerfile_version=$DOCKERFILE_VERSION" >> $GITHUB_OUTPUT

          CONFIG_VERSION=$(grep -E '^version:' requestly/config.yaml | sed 's/version: "//' | sed 's/"//')
          echo "config_version=$CONFIG_VERSION" >> $GITHUB_OUTPUT

          echo "Current requestly app version: $DOCKERFILE_VERSION"
          echo "Current addon version: $CONFIG_VERSION"

      - name: Get latest requestly app version
        id: latest
        run: |
          LATEST_VERSION=$(curl -fsSL "https://raw.githubusercontent.com/requestly/interceptor/master/app/package.json" | jq -r '.version')
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "release_url=https://github.com/requestly/interceptor/commits/master" >> $GITHUB_OUTPUT
          echo "release_type=latest" >> $GITHUB_OUTPUT
          echo "Latest app version: $LATEST_VERSION"

      - name: Compare versions and check existing PRs
        id: compare
        run: |
          CURRENT_APP_VERSION="${{ steps.current.outputs.dockerfile_version }}"
          LATEST_VERSION="${{ steps.latest.outputs.latest_version }}"
          RELEASE_TYPE="${{ steps.latest.outputs.release_type }}"

          IS_NEW_VERSION=false
          if [ "$(printf '%s\n' "$LATEST_VERSION" "$CURRENT_APP_VERSION" | sort -V | head -n1)" = "$CURRENT_APP_VERSION" ] && [ "$CURRENT_APP_VERSION" != "$LATEST_VERSION" ]; then
            IS_NEW_VERSION=true
          fi

          NEEDS_LABEL_UPDATE=false
          EXISTING_PR=""

          if [ "$IS_NEW_VERSION" = "false" ]; then
            PR_LIST=$(gh pr list --search "requestly $LATEST_VERSION" --json number,labels,headRefName --jq '.[]')

            if [ -n "$PR_LIST" ]; then
              while IFS= read -r pr; do
                PR_NUMBER=$(echo "$pr" | jq -r '.number')
                PR_LABELS=$(echo "$pr" | jq -r '.labels[].name')
                PR_BRANCH=$(echo "$pr" | jq -r '.headRefName')

                if [ "$RELEASE_TYPE" = "latest" ] && echo "$PR_LABELS" | grep -q "pre-release"; then
                  NEEDS_LABEL_UPDATE=true
                  EXISTING_PR="$PR_NUMBER"
                  EXISTING_BRANCH="$PR_BRANCH"
                  echo "Found PR #$PR_NUMBER with pre-release label that needs update to latest"
                  break
                elif [ "$RELEASE_TYPE" = "pre-release" ] && echo "$PR_LABELS" | grep -q "latest"; then
                  NEEDS_LABEL_UPDATE=true
                  EXISTING_PR="$PR_NUMBER"
                  EXISTING_BRANCH="$PR_BRANCH"
                  echo "Found PR #$PR_NUMBER with latest label that needs update to pre-release"
                  break
                fi
              done <<< "$PR_LIST"
            fi
          fi

          if [ "$IS_NEW_VERSION" = "true" ] || [ "$NEEDS_LABEL_UPDATE" = "true" ]; then
            echo "needs_upgrade=true" >> $GITHUB_OUTPUT
            echo "needs_label_update=$NEEDS_LABEL_UPDATE" >> $GITHUB_OUTPUT
            echo "existing_pr=$EXISTING_PR" >> $GITHUB_OUTPUT
            echo "existing_branch=$EXISTING_BRANCH"
            echo "is_new_version=$IS_NEW_VERSION"
            if [ "$IS_NEW_VERSION" = "true" ]; then
              echo "New requestly version available: $LATEST_VERSION (current: $CURRENT_APP_VERSION)"
            else
              echo "Release type changed to $RELEASE_TYPE for version $LATEST_VERSION"
            fi
          else
            echo "needs_upgrade=false" >> $GITHUB_OUTPUT
            echo "Already up-to-date or no new version"
          fi

      - name: Generate new addon version
        id: addon_version
        if: steps.compare.outputs.needs_upgrade == 'true'
        run: |
          CURRENT_YEAR=$(date +%y)
          CURRENT_MONTH=$(date +%m)
          CURRENT_MONTH=${CURRENT_MONTH#0}

          CURRENT_ADDON_VERSION="${{ steps.current.outputs.config_version }}"
          CURRENT_PATCH=$(echo $CURRENT_ADDON_VERSION | cut -d. -f3)

          CURRENT_YEAR_MONTH=$(echo $CURRENT_ADDON_VERSION | cut -d. -f1,2)
          NEW_YEAR_MONTH="$CURRENT_YEAR.$CURRENT_MONTH"

          if [ "$CURRENT_YEAR_MONTH" = "$NEW_YEAR_MONTH" ]; then
            NEW_PATCH=$((CURRENT_PATCH + 1))
          else
            NEW_PATCH=1
          fi

          NEW_ADDON_VERSION="$NEW_YEAR_MONTH.$NEW_PATCH"
          echo "new_addon_version=$NEW_ADDON_VERSION" >> $GITHUB_OUTPUT
          echo "New addon version: $NEW_ADDON_VERSION"

      - name: Create or checkout upgrade branch
        id: branch
        if: steps.compare.outputs.needs_upgrade == 'true'
        run: |
          if [ "${{ steps.compare.outputs.needs_label_update }}" = "true" ] && [ -n "${{ steps.compare.outputs.existing_branch }}" ]; then
            BRANCH_NAME="${{ steps.compare.outputs.existing_branch }}"
            echo "Using existing branch $BRANCH_NAME for label update"
          else
            BRANCH_NAME="upgrade/requestly-v${{ steps.latest.outputs.latest_version }}"
          fi

          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            echo "Branch $BRANCH_NAME exists on remote, checking it out..."
            git fetch origin "$BRANCH_NAME"
            git checkout -B "$BRANCH_NAME" origin/"$BRANCH_NAME"
          else
            echo "Creating new branch $BRANCH_NAME..."
            git checkout -b "$BRANCH_NAME"
          fi

          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Update config.yaml
        if: steps.compare.outputs.needs_upgrade == 'true' && (steps.compare.outputs.is_new_version == 'true' || github.event.inputs.force == 'true')
        run: |
          sed -i "s/^version: .*/version: \"${{ steps.addon_version.outputs.new_addon_version }}\"/" requestly/config.yaml
          echo "Updated config.yaml version to ${{ steps.addon_version.outputs.new_addon_version }}"

      - name: Update Dockerfile
        if: steps.compare.outputs.needs_upgrade == 'true' && (steps.compare.outputs.is_new_version == 'true' || github.event.inputs.force == 'true')
        run: |
          sed -i "s/ARG REQUESTLY_APP_VERSION=.*/ARG REQUESTLY_APP_VERSION=${{ steps.latest.outputs.latest_version }}/" requestly/Dockerfile
          echo "Updated Dockerfile version to ${{ steps.latest.outputs.latest_version }}"

      - name: Commit changes
        if: steps.compare.outputs.needs_upgrade == 'true' && (steps.compare.outputs.is_new_version == 'true' || github.event.inputs.force == 'true')
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add requestly/config.yaml requestly/Dockerfile
          FORCE_FLAG="${{ github.event.inputs.force }}"

          if git diff --cached --quiet; then
            if [ "$FORCE_FLAG" = "true" ]; then
              echo "No changes but force flag is set - creating empty commit"
              git commit --allow-empty -m "⬆️ Upgrade requestly to ${{ steps.latest.outputs.latest_version }} (addon ${{ steps.addon_version.outputs.new_addon_version }})"
            else
              echo "No changes to commit - requestly version is already up to date on this branch"
              exit 0
            fi
          else
            git commit -m "⬆️ Upgrade requestly to ${{ steps.latest.outputs.latest_version }} (addon ${{ steps.addon_version.outputs.new_addon_version }})"
          fi

      - name: Push branch
        if: steps.compare.outputs.needs_upgrade == 'true' && (steps.compare.outputs.is_new_version == 'true' || github.event.inputs.force == 'true')
        run: |
          BRANCH_NAME="${{ steps.branch.outputs.branch_name }}"
          FORCE_FLAG="${{ github.event.inputs.force || 'true' }}"

          git fetch origin || true

          if [ "$FORCE_FLAG" = "true" ]; then
            echo "Force flag set - pushing branch unconditionally..."
            git push origin "$BRANCH_NAME" --force
          elif git rev-parse origin/"$BRANCH_NAME" >/dev/null 2>&1; then
            if [ -n "$(git log origin/"$BRANCH_NAME"..HEAD 2>/dev/null)" ]; then
              echo "New commits found - pushing updates..."
              git push origin "$BRANCH_NAME" --force
            else
              echo "No new commits to push - branch is up to date"
            fi
          else
            echo "Creating new branch $BRANCH_NAME on remote..."
            git push origin "$BRANCH_NAME"
          fi

      - name: Setup GitHub CLI
        if: steps.compare.outputs.needs_upgrade == 'true'
        uses: wusatosi/setup-gh@v1

      - name: Create or Update Pull Request
        if: steps.compare.outputs.needs_upgrade == 'true'
        run: |
          echo "Current branch: $(git branch --show-current)"
          echo "Remote URL: $(git remote get-url origin)"

          LATEST_VERSION="${{ steps.latest.outputs.latest_version }}"
          NEW_ADDON_VERSION="${{ steps.addon_version.outputs.new_addon_version }}"
          RELEASE_TYPE="${{ steps.latest.outputs.release_type }}"
          BRANCH_NAME="${{ steps.branch.outputs.branch_name }}"
          IS_NEW_VERSION="${{ steps.compare.outputs.is_new_version }}"

          FORCE_FLAG="${{ github.event.inputs.force || 'true' }}"

          OPEN_PR=$(gh pr list --head "$BRANCH_NAME" --base main --state open --json number --jq '.[0].number')
          ANY_PR=$(gh pr list --head "$BRANCH_NAME" --base main --state all --json number --jq '.[0].number')

          if [ -n "$OPEN_PR" ]; then
            echo "Open PR #$OPEN_PR found, updating labels..."

            CURRENT_LABELS=$(gh pr view "$OPEN_PR" --json labels --jq '.labels[].name')
            echo "Current labels: $CURRENT_LABELS"

            if echo "$CURRENT_LABELS" | grep -q "pre-release\|latest"; then
              gh pr edit "$OPEN_PR" --remove-label "pre-release,latest" 2>/dev/null || true
            fi

            gh pr edit "$OPEN_PR" --add-label "$RELEASE_TYPE"

            if [ "$IS_NEW_VERSION" = "true" ]; then
              CURRENT_TITLE=$(gh pr view "$OPEN_PR" --json title --jq '.title')
              NEW_TITLE="⬆️ Upgrade requestly to $LATEST_VERSION (addon $NEW_ADDON_VERSION)"
              if [ "$CURRENT_TITLE" != "$NEW_TITLE" ]; then
                gh pr edit "$OPEN_PR" --title "$NEW_TITLE"
                echo "Updated PR title to: $NEW_TITLE"
              fi
            fi

            echo "PR #$OPEN_PR updated successfully"
          elif [ "$FORCE_FLAG" = "true" ]; then
            echo "Force flag is set - creating new PR even if one existed before..."
            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "⬆️ Upgrade requestly to $LATEST_VERSION (addon $NEW_ADDON_VERSION)" \
              --body "Auto-upgrade requestly to version $LATEST_VERSION

            **Changes:**
            - Updated config.yaml addon version to $NEW_ADDON_VERSION
            - Updated Dockerfile to use requestly app@$LATEST_VERSION

            **Release:** ${{ steps.latest.outputs.release_url }}

            This PR was created automatically by the auto-upgrade workflow (forced recreation)." \
              --label "auto-upgrade,dependencies,$RELEASE_TYPE"

            echo "PR created successfully (forced)"
          elif [ -n "$ANY_PR" ]; then
            echo "PR #$ANY_PR already exists but is closed/merged - not creating duplicate (use 'force' to recreate)"
          elif [ "$IS_NEW_VERSION" = "true" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "⬆️ Upgrade requestly to $LATEST_VERSION (addon $NEW_ADDON_VERSION)" \
              --body "Auto-upgrade requestly to version $LATEST_VERSION

            **Changes:**
            - Updated config.yaml addon version to $NEW_ADDON_VERSION
            - Updated Dockerfile to use requestly app@$LATEST_VERSION

            **Release:** ${{ steps.latest.outputs.release_url }}

            This PR was created automatically by the auto-upgrade workflow." \
              --label "auto-upgrade,dependencies,$RELEASE_TYPE"

            echo "PR created successfully"
          else
            echo "No new version and no open PR - nothing to do"
          fi
