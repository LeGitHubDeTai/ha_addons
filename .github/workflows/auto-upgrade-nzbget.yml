name: Auto-upgrade nzbget

# Workflow to automatically upgrade NZBGet addon when new releases are available
on:
  schedule:
    # Run daily at 9:00 AM UTC
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force recreate PR even if one already exists (closed/merged)'
        required: false
        default: true
        type: boolean

jobs:
  auto-upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current versions
        id: current
        run: |
          # Get nzbget version from build.yaml
          BUILD_TAG=$(grep -E 'linuxserver/nzbget:' nzbget/build.yaml | head -1 | sed 's/.*://' | sed 's/[[:space:]]*//' | sed 's/"//g')
          # Extract version part (24.0 from amd64-24.0-ls42)
          BUILD_VERSION=$(echo "$BUILD_TAG" | grep -oE '[0-9]+\.[0-9]+' | head -1)
          echo "build_tag=$BUILD_TAG" >> $GITHUB_OUTPUT
          echo "build_version=$BUILD_VERSION" >> $GITHUB_OUTPUT

          # Get addon version from config.yaml
          CONFIG_VERSION=$(grep -E '^version:' nzbget/config.yaml | sed 's/version: "//' | sed 's/"//')
          echo "config_version=$CONFIG_VERSION" >> $GITHUB_OUTPUT

          echo "Current NZBGet build tag: $BUILD_TAG"
          echo "Current NZBGet version: $BUILD_VERSION"
          echo "Current addon version: $CONFIG_VERSION"

      - name: Get latest nzbget release
        id: latest
        run: |
          # Get all releases from linuxserver/docker-nzbget
          LATEST_RELEASE_DATA=$(curl -s "https://api.github.com/repos/linuxserver/docker-nzbget/releases")

          # Extract tag names and find first valid version for stable branch
          # Pattern: X.Y-lsNNN
          LATEST_RELEASE=$(echo "$LATEST_RELEASE_DATA" | jq -r '.[].tag_name' | while read -r tag; do
            if [[ "$tag" =~ ^[0-9]+\.[0-9]+-ls[0-9]+$ ]]; then
              echo "$tag"
              break
            fi
          done)

          # Get full release data for the found version
          RELEASE_INFO=$(echo "$LATEST_RELEASE_DATA" | jq ".[] | select(.tag_name==\"$LATEST_RELEASE\")")

          LATEST_VERSION=$(echo "$LATEST_RELEASE" | sed 's/-ls[0-9]*//')
          LATEST_BUILD=$(echo "$LATEST_RELEASE" | grep -oE 'ls[0-9]+')
          IS_PRERELEASE=$(echo "$RELEASE_INFO" | jq -r '.prerelease')
          RELEASE_URL=$(echo "$RELEASE_INFO" | jq -r '.html_url')

          if [ "$IS_PRERELEASE" = "true" ]; then
            RELEASE_TYPE="pre-release"
          else
            RELEASE_TYPE="latest"
          fi

          echo "latest_release=$LATEST_RELEASE" >> $GITHUB_OUTPUT
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "latest_build=$LATEST_BUILD" >> $GITHUB_OUTPUT
          echo "release_type=$RELEASE_TYPE" >> $GITHUB_OUTPUT
          echo "release_url=$RELEASE_URL" >> $GITHUB_OUTPUT

          echo "Latest release: $LATEST_RELEASE"

      - name: Compare versions and check existing PRs
        id: compare
        run: |
          CURRENT_VERSION="${{ steps.current.outputs.build_version }}"
          LATEST_VERSION="${{ steps.latest.outputs.latest_version }}"

          IS_NEW_VERSION=false
          if [ "$(printf '%s\n' "$LATEST_VERSION" "$CURRENT_VERSION" | sort -V | head -n1)" = "$CURRENT_VERSION" ] && [ "$CURRENT_VERSION" != "$LATEST_VERSION" ]; then
            IS_NEW_VERSION=true
          fi

          if [ "$IS_NEW_VERSION" = "true" ]; then
            echo "needs_upgrade=true" >> $GITHUB_OUTPUT
            echo "New NZBGet version available: $LATEST_VERSION (current: $CURRENT_VERSION)"
          else
            echo "needs_upgrade=false" >> $GITHUB_OUTPUT
            echo "Already up-to-date"
          fi

      - name: Generate new addon version
        id: addon_version
        if: steps.compare.outputs.needs_upgrade == 'true'
        run: |
          CURRENT_YEAR=$(date +%y)
          CURRENT_MONTH=$(date +%m)
          CURRENT_MONTH=${CURRENT_MONTH#0}

          CURRENT_ADDON_VERSION="${{ steps.current.outputs.config_version }}"
          CURRENT_PATCH=$(echo $CURRENT_ADDON_VERSION | cut -d. -f3)

          CURRENT_YEAR_MONTH=$(echo $CURRENT_ADDON_VERSION | cut -d. -f1,2)
          NEW_YEAR_MONTH="$CURRENT_YEAR.$CURRENT_MONTH"

          if [ "$CURRENT_YEAR_MONTH" = "$NEW_YEAR_MONTH" ]; then
            NEW_PATCH=$((CURRENT_PATCH + 1))
          else
            NEW_PATCH=1
          fi

          NEW_ADDON_VERSION="$NEW_YEAR_MONTH.$NEW_PATCH"
          echo "new_addon_version=$NEW_ADDON_VERSION" >> $GITHUB_OUTPUT

      - name: Create or checkout upgrade branch
        id: branch
        if: steps.compare.outputs.needs_upgrade == 'true'
        run: |
          BRANCH_NAME="upgrade/nzbget-v${{ steps.latest.outputs.latest_version }}"

          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            git fetch origin "$BRANCH_NAME"
            git checkout -B "$BRANCH_NAME" origin/"$BRANCH_NAME"
          else
            git checkout -b "$BRANCH_NAME"
          fi

          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Update config.yaml
        if: steps.compare.outputs.needs_upgrade == 'true' && (steps.compare.outputs.is_new_version == 'true' || github.event.inputs.force == 'true')
        run: |
          sed -i "s/^version: .*/version: \"${{ steps.addon_version.outputs.new_addon_version }}\"/" nzbget/config.yaml
          echo "Updated config.yaml version to ${{ steps.addon_version.outputs.new_addon_version }}"

      - name: Update build.yaml
        if: steps.compare.outputs.needs_upgrade == 'true' && (steps.compare.outputs.is_new_version == 'true' || github.event.inputs.force == 'true')
        run: |
          UPSTREAM_VERSION="${{ steps.latest.outputs.latest_version }}"
          LATEST_BUILD="${{ steps.latest.outputs.latest_build }}"
          sed -i "s/nzbget:.*-[0-9.]*-ls[0-9]*/nzbget:${UPSTREAM_VERSION}-${LATEST_BUILD}/g" nzbget/build.yaml
          echo "Updated build.yaml to nzbget:${UPSTREAM_VERSION}-${LATEST_BUILD}"

      - name: Commit changes
        if: steps.compare.outputs.needs_upgrade == 'true' && (steps.compare.outputs.is_new_version == 'true' || github.event.inputs.force == 'true')
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add nzbget/config.yaml nzbget/build.yaml
          FORCE_FLAG="${{ github.event.inputs.force }}"

          if git diff --cached --quiet; then
            if [ "$FORCE_FLAG" = "true" ]; then
              git commit --allow-empty -m "⬆️ Upgrade NZBGet to ${{ steps.latest.outputs.latest_version }} (addon ${{ steps.addon_version.outputs.new_addon_version }})"
            else
              exit 0
            fi
          else
            git commit -m "⬆️ Upgrade NZBGet to ${{ steps.latest.outputs.latest_version }} (addon ${{ steps.addon_version.outputs.new_addon_version }})"
          fi

      - name: Push branch
        if: steps.compare.outputs.needs_upgrade == 'true' && (steps.compare.outputs.is_new_version == 'true' || github.event.inputs.force == 'true')
        run: |
          BRANCH_NAME="${{ steps.branch.outputs.branch_name }}"
          FORCE_FLAG="${{ github.event.inputs.force || 'true' }}"

          git fetch origin || true

          if [ "$FORCE_FLAG" = "true" ]; then
            git push origin "$BRANCH_NAME" --force
          elif git rev-parse origin/"$BRANCH_NAME" >/dev/null 2>&1; then
            if [ -n "$(git log origin/"$BRANCH_NAME"..HEAD 2>/dev/null)" ]; then
              git push origin "$BRANCH_NAME" --force
            fi
          else
            git push origin "$BRANCH_NAME"
          fi

      - name: Setup GitHub CLI
        if: steps.compare.outputs.needs_upgrade == 'true'
        uses: wusatosi/setup-gh@v1

      - name: Create or Update Pull Request
        if: steps.compare.outputs.needs_upgrade == 'true'
        run: |
          LATEST_VERSION="${{ steps.latest.outputs.latest_version }}"
          NEW_ADDON_VERSION="${{ steps.addon_version.outputs.new_addon_version }}"
          RELEASE_TYPE="${{ steps.latest.outputs.release_type }}"
          BRANCH_NAME="${{ steps.branch.outputs.branch_name }}"
          IS_NEW_VERSION="${{ steps.compare.outputs.is_new_version }}"

          OPEN_PR=$(gh pr list --head "$BRANCH_NAME" --base main --state open --json number --jq '.[0].number')
          ANY_PR=$(gh pr list --head "$BRANCH_NAME" --base main --state all --json number --jq '.[0].number')

          if [ -n "$OPEN_PR" ]; then
            echo "Open PR #$OPEN_PR found, updating labels..."
            gh pr edit "$OPEN_PR" --remove-label "pre-release,latest" 2>/dev/null || true
            gh pr edit "$OPEN_PR" --add-label "$RELEASE_TYPE"
            if [ "$IS_NEW_VERSION" = "true" ]; then
              gh pr edit "$OPEN_PR" --title "⬆️ Upgrade NZBGet to $LATEST_VERSION (addon $NEW_ADDON_VERSION)"
            fi
          elif [ "$IS_NEW_VERSION" = "true" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "⬆️ Upgrade NZBGet to $LATEST_VERSION (addon $NEW_ADDON_VERSION)" \
              --body "Auto-upgrade NZBGet to version $LATEST_VERSION

            **Changes:**
            - Updated config.yaml addon version to $NEW_ADDON_VERSION
            - Updated build.yaml to use linuxserver/nzbget:${LATEST_VERSION}-${LATEST_BUILD}

            **Release:** ${{ steps.latest.outputs.release_url }}

            This PR was created automatically by the auto-upgrade workflow." \
              --label "auto-upgrade,dependencies,$RELEASE_TYPE"
          fi
