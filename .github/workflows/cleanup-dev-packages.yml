name: Cleanup dev packages

on:
  schedule:
    # Tous les samedis à 03:00 UTC
    - cron: '0 3 * * 6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (liste sans supprimer)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  OWNER_LC: legithubdetai
  REPO_PREFIX: ha_addons

jobs:
  detect-orphans:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
      count: ${{ steps.collect.outputs.count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yq
        run: |
          if ! command -v yq >/dev/null 2>&1; then
            wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
            chmod +x /usr/local/bin/yq
          fi
          yq --version

      - name: Detect dev- packages without dev branch
        id: collect
        run: |
          set -euo pipefail

          DRY_RUN="${{ inputs.dry_run }}"
          echo "### 🧹 Cleanup dev packages (GITHUB_TOKEN uniquement)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Mode dry-run: **${DRY_RUN:-false}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "📡 Branches distantes :"
          git fetch origin --prune 2>/dev/null || true
          REMOTE_BRANCHES=$(git ls-remote --heads origin | sed -E 's|.*refs/heads/||')
          echo "$REMOTE_BRANCHES"
          echo ""

          branch_exists() {
            echo "$REMOTE_BRANCHES" | grep -Fxq "$1"
          }

          mapfile -t ADDON_DIRS < <(find . -maxdepth 2 -name "config.yaml" -exec dirname {} \; | sed 's|^\./||' | grep -v '^\.$' | sort -u)
          echo "Addons détectés : ${ADDON_DIRS[*]}"

          # Construit la liste des noms de packages attendus.
          # Convention de docker-build-publish.yml :
          #   ghcr.io/<owner>/ha_addons/dev-<slug>-<arch>  => package "ha_addons/dev-<slug>-<arch>"
          PACKAGES=()
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Addon | Slug | Branche dev | Packages ciblés |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY

          for addon_dir in "${ADDON_DIRS[@]}"; do
            SLUG=$(yq eval '.slug' "$addon_dir/config.yaml" 2>/dev/null | tr -d '"' | xargs || echo "$addon_dir")
            if [ -z "$SLUG" ] || [ "$SLUG" = "null" ]; then
              SLUG="$addon_dir"
            fi
            ARCHS=$(yq eval '.arch[]' "$addon_dir/config.yaml" 2>/dev/null | tr '\n' ' ' || echo "amd64 aarch64")

            HAS_DEV=false
            FOUND=""
            for candidate in "$addon_dir-dev" "dev-$addon_dir" "$SLUG-dev" "dev-$SLUG"; do
              if branch_exists "$candidate"; then
                HAS_DEV=true
                FOUND="$candidate"
                break
              fi
            done

            if [ "$HAS_DEV" = true ]; then
              echo "✅ $addon_dir (slug=$SLUG) : branche $FOUND existe → conservé"
              echo "| $addon_dir | $SLUG | ✅ \`$FOUND\` | conservés |" >> $GITHUB_STEP_SUMMARY
              continue
            fi

            echo "🗑️ $addon_dir (slug=$SLUG, archs=$ARCHS) : aucune branche dev → à supprimer"
            TARGETS=""
            for arch in $ARCHS; do
              PKG="$REPO_PREFIX/dev-$SLUG-$arch"
              PACKAGES+=("$PKG")
              TARGETS="$TARGETS \`$PKG\`"
            done
            echo "| $addon_dir | $SLUG | ❌ aucune | $TARGETS |" >> $GITHUB_STEP_SUMMARY
          done

          # Déduplique + fabrique la matrice JSON ["pkg1","pkg2",...]
          MATRIX=$(printf '%s\n' "${PACKAGES[@]:-}" | grep -v '^$' | sort -u | jq -R . | jq -c -s '. // []')
          COUNT=$(echo "$MATRIX" | jq 'length')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo ""
          echo "Matrice ($COUNT packages) : $MATRIX"

  delete:
    runs-on: ubuntu-latest
    needs: detect-orphans
    if: needs.detect-orphans.outputs.count != '0' && inputs.dry_run != true
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect-orphans.outputs.matrix) }}
    steps:
      # Suppression sans action Node (évite le warning Node 20) et sans LIST global.
      # On interroge uniquement le package connu : s'il n'existe pas → skip propre,
      # plus d'erreur "Package not found". Fonctionne avec le seul GITHUB_TOKEN
      # si le repo a le rôle Admin sur le package (auto quand publié depuis ce repo).
      - name: Delete versions of ${{ matrix.package }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          PKG="${{ matrix.package }}"
          ENCODED=$(echo "$PKG" | sed 's|/|%2F|g')
          echo "📦 Package : $PKG (encodé : $ENCODED)"

          VERSIONS_RAW=""
          for endpoint in "/users/$OWNER_LC/packages/container/$ENCODED/versions?per_page=100" "/user/packages/container/$ENCODED/versions?per_page=100"; do
            echo "Essai : GET $endpoint"
            VERSIONS_RAW=$(gh api --paginate "$endpoint" 2>&1)
            STATUS=$?
            if [ $STATUS -eq 0 ]; then
              echo "✅ Versions listées via $endpoint"
              break
            fi
            echo "→ échec ($STATUS) :"
            echo "$VERSIONS_RAW" | head -n 10
            if echo "$VERSIONS_RAW" | grep -qi "not found\|404"; then
              echo "ℹ️ Package introuvable (jamais publié ou déjà supprimé) → skip, pas d'erreur."
              exit 0
            fi
            VERSIONS_RAW=""
          done

          if [ -z "$VERSIONS_RAW" ]; then
            echo "⚠️ Impossible de lister les versions. Si 403 : package GHCR → Settings → Manage Actions Access → repo ha_addons en Admin."
            exit 0
          fi

          IDS=$(echo "$VERSIONS_RAW" | jq -s 'add // [] | .[].id' 2>/dev/null || true)
          if [ -z "$IDS" ]; then
            echo "ℹ️ Aucune version à supprimer → skip."
            exit 0
          fi

          echo "Versions à supprimer :"
          echo "$IDS"
          for vid in $IDS; do
            echo "🗑️ DELETE version $vid"
            OUT=$(gh api --method DELETE "/users/$OWNER_LC/packages/container/$ENCODED/versions/$vid" 2>&1 || \
               gh api --method DELETE "/user/packages/container/$ENCODED/versions/$vid" 2>&1)
            STATUS=$?
            if [ $STATUS -eq 0 ]; then
              echo "  ✅ version $vid supprimée"
            elif echo "$OUT" | grep -qi "last tagged version.*delete the package instead"; then
              echo "  ℹ️ Dernière version taguée : suppression du package entier requise."
              break
            else
              echo "  ⚠️ échec version $vid (continue) :"
              echo "$OUT" | head -n 5
            fi
          done

          # Supprime le package entier (requis quand il ne reste que la dernière
          # version taguée ; GitHub refuse DELETE version dans ce cas avec 400).
          echo "🗑️ DELETE package $PKG"
          if gh api --method DELETE "/users/$OWNER_LC/packages/container/$ENCODED" 2>&1 || \
             gh api --method DELETE "/user/packages/container/$ENCODED" 2>&1; then
            echo "  ✅ package $PKG supprimé"
          else
            echo "  ℹ️ package $PKG déjà vide/supprimé ou non supprimable (vérifiez Manage Actions Access → Admin)."
          fi
          echo "✅ Terminé pour $PKG"

  summary:
    runs-on: ubuntu-latest
    needs: [detect-orphans, delete]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Résultat nettoyage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Packages orphelins détectés : **${{ needs.detect-orphans.outputs.count }}**" >> $GITHUB_STEP_SUMMARY
          echo "Résultat delete : **${{ needs.delete.result }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "🔍 Dry-run : aucune suppression effectuée." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Si un delete échoue en 403 / Package not found : page du package GHCR → Settings → Manage Actions Access → ajouter le repo \`ha_addons\` avec le rôle \`Admin\`. C'est ce qui donne au \`GITHUB_TOKEN\` le droit de supprimer sans PAT._" >> $GITHUB_STEP_SUMMARY
