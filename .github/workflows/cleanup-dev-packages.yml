name: Cleanup dev packages

on:
  schedule:
    # Tous les samedis à 03:00 UTC
    - cron: '0 3 * * 6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (liste sans supprimer)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  OWNER_LC: legithubdetai
  REPO_PREFIX: ha_addons
  # Token pour GHCR - en ordre de priorité :
  # 1. GITHUB_TOKEN (injecté par GitHub Actions, permissions limitées)
  # 2. PAT via secret PACKAGES_PAT (à créer dans repo Settings → Secrets)
  GH_TOKEN_FALLBACK: ""

jobs:
  detect-orphans:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
      count: ${{ steps.collect.outputs.count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq jq
          fi

      - name: Detect dev- packages to remove
        id: collect
        run: |
          set -euo pipefail

          DRY_RUN="${{ inputs.dry_run }}"
          echo "### 🧹 Cleanup dev packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Mode dry-run: **${DRY_RUN:-false}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

# === ÉTAPE 1 : Lister TOUS les packages GHCR dev-* ===
  echo "📦 ÉTAPE 1 : Récupération de TOUTES les packages GHCR en cours..."
  echo ""

  # Récupérer tous les packages container
  # Essayer dans l'ordre : GITHUB_TOKEN d'abord, puis fallback PAT
  PACKAGES_JSON="[]"
  
  # Construction du header d'authentification
  AUTH_HEADER="Authorization: token ${GITHUB_TOKEN}"
  # Si GITHUB_TOKEN est vide (execution locale), essayer avec le fallback PAT
  if [ -z "$GITHUB_TOKEN" ] || [ "$GITHUB_TOKEN" = "__DEFAULT_GITHUB_TOKEN__" ]; then
    if [ -n "${PAT_SECRET:-}" ] && [ "$PAT_SECRET" != "default" ]; then
      AUTH_HEADER="Authorization: token ${PAT_SECRET}"
      echo "Utilisation du PAT pour l'authentification GHCR..."
    else
      echo "⚠️ GITHUB_TOKEN non défini, essai avec permissions limitées..."
    fi
  fi

  # Tentative 1 : API dépôt (toujours dispo avec GITHUB_TOKEN du repo)
  PACKAGES_JSON=$(curl -s -H "$AUTH_HEADER" \
    "https://api.github.com/repos/$OWNER_LC/$REPO_PREFIX/packages?package_type=container&per_page=100" 2>/dev/null | jq -s 'add // []' || echo "[]")
  
  # Si aucun paquet trouvé avec l'authentification dépôt, essayer API utilisateur
  if [ "$PACKAGES_JSON" = "[]" ] || [ -z "$PACKAGES_JSON" ]; then
    AUTH_HEADER_USER="Authorization: token ${GITHUB_TOKEN}"
    if [ -n "${PAT_SECRET:-}" ] && [ "$PAT_SECRET" != "default" ]; then
      AUTH_HEADER_USER="Authorization: token ${PAT_SECRET}"
    fi
    PACKAGES_JSON=$(curl -s -H "$AUTH_HEADER_USER" \
      "https://api.github.com/users/$OWNER_LC/packages?package_type=container&per_page=100" 2>/dev/null | jq -s 'add // []' || echo "[]")
  fi
  
  # Deuxième fallback : API dépôt avec PAT si différent
  if [ "$PACKAGES_JSON" = "[]" ] || [ -z "$PACKAGES_JSON" ]; then
    if [ -n "${PAT_SECRET:-}" ] && [ "$PAT_SECRET" != "default" ]; then
      AUTH_HEADER_PAT="Authorization: token ${PAT_SECRET}"
      PACKAGES_JSON=$(curl -s -H "$AUTH_HEADER_PAT" \
        "https://api.github.com/repos/$OWNER_LC/$REPO_PREFIX/packages?package_type=container&per_page=100" 2>/dev/null | jq -s 'add // []' || echo "[]")
    fi
  fi

          # Filtrer uniquement les packages dev-*
          # Format expected: "ha_addons/dev-planka-amd64" or "dev-planka-amd64"
          ALL_DEV_PACKAGES=$(echo "$PACKAGES_JSON" | jq -r --arg prefix "$REPO_PREFIX" '
            .[]
            | .name as $n
            | select(
              ($n | startswith($prefix + "/dev-")) or
              ($n | startswith("dev-"))
            )
            | $n
          ' | sort -u || true)

          if [ -z "$ALL_DEV_PACKAGES" ] || [ "$ALL_DEV_PACKAGES" = "null" ]; then
            echo "ℹ️ Aucun package dev-* trouvé dans ce dépôt via l'API."
            echo "matrix=[]" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
            echo ""
            echo "Aucun package dev- à traiter."
            exit 0
          fi

          echo "✅ Found $(echo "$ALL_DEV_PACKAGES" | wc -l) packages dev-* sur GHCR :"
          echo "$ALL_DEV_PACKAGES"
          echo ""

          # === ÉTAPE 2 : Obtenir les addons et leurs branches dev ===
          echo "📦 ÉTAPE 2 : Analyse des addons et branches en cours..."
          echo ""

          # Obtenir les dossiers d'addon
          mapfile -t ADDON_DIRS < <(find . -maxdepth 2 -name "config.yaml" -exec dirname {} \; | sed 's|^\./||' | grep -v '^\.$' | sort -u)
          echo "Addons main détectés : ${ADDON_DIRS[*]}"
          echo ""

          # Obtenir les branches dev distantes
          git fetch origin --prune 2>/dev/null || true
          REMOTE_BRANCHES=$(git ls-remote --heads origin | sed -E 's|.*refs/heads/||')
          DEV_BRANCHES=$(echo "$REMOTE_BRANCHES" | grep -E '(-dev$|^dev-)' || true)

          # Extraire les noms d'addon depuis les branches dev (ex: planka-dev -> planka)
          declare -A DEV_ADDONS=()  # addon_name -> branch_name
          if [ -n "$DEV_BRANCHES" ]; then
            for BRANCH in $DEV_BRANCHES; do
              # Enlever le suffixe -dev ou préfixe dev-
              ADDON_NAME=$(echo "$BRANCH" | sed -E 's/-dev$//; s/^dev-//')
              DEV_ADDONS["$ADDON_NAME"]="$BRANCH"
            done
          fi

          echo "🌿 Branches dev trouvées : ${#DEV_ADDONS[@]}"
          for KEY in "${!DEV_ADDONS[@]}"; do
            echo "  - $KEY → branche ${DEV_ADDONS[$KEY]}"
          done
          echo ""

          # === ÉTAPE 3 : Déterminer quels packages supprimer ===
          echo "📦 ÉTAPE 3 : Détermination des packages à supprimer..."
          echo ""

          DELETE_PKGS=()
          KEEP_PKGS=()
          SUMMARY_ROWS="| Package dev-* | Décision | Détail |"
          SUMMARY_ROWS+="\n|---|---|---|"

          # Pour chaque package dev-*, vérifier si son addon a une branche dev vivante
          while IFS= read -r PKG; do
            [ -z "$PKG" ] && continue

            # Extraire le slug depuis le nom du package
            # Format: ha_addons/dev-slug-arch ou dev-slug-arch
            SLUG_FROM_PKG=$(echo "$PKG" | sed -E 's|^'"$REPO_PREFIX"'/||; s|-amd64|-aarch64|; s|-[a-z0-9]+$||')

            # Vérifier si cette branch existe pour cet addon
            HAS_DEV_BRANCH=false
            BRANCH_INFO=""

            if [ -n "$DEV_BRANCHES" ]; then
              # Chercher si une branche correspond à cet addon
              for BRANCH in $DEV_BRANCHES; do
                ADDON_FROM_BRANCH=$(echo "$BRANCH" | sed -E 's/-dev$//; s/^dev-//')
                if [ "$ADDON_FROM_BRANCH" = "$SLUG_FROM_PKG" ]; then
                  HAS_DEV_BRANCH=true
                  BRANCH_INFO="$BRANCH"
                  break
                fi
              done
            fi

            if [ "$HAS_DEV_BRANCH" = true ]; then
              # Cette branche existe → conserver le package
              KEEP_PKGS["$PKG"]=1
              SUMMARY_ROWS+="\n| \`$PKG\` | ✅ conservé | branche dev vivante \`$BRANCH_INFO\` |"
              echo "✅ \`$PKG\` → conservé (branche \`$BRANCH_INFO\` existante)"
            else
                # Aucune branche dev → marquer pour suppression
                DELETE_PKGS["$PKG"]=1
                SUMMARY_ROWS+="\n| \`$PKG\` | 🗑️ à supprimer | aucune branche dev vivante |"
                echo "🗑️ \`$PKG\` → marqué pour suppression (pas de branche dev)"
            fi
          done <<< "$ALL_DEV_PACKAGES"

          # === Préparer la matrix ===
          FILTERED=()
          for PKG in "${!DELETE_PKGS[@]}"; do
            if [ -z "${KEEP_PKGS[$PKG]:-}" ]; then
              FILTERED+=("$PKG")
            fi
          done

          # Trier et formater pour jq
          MATRIX=$(printf '%s\n' "${FILTERED[@]:-}" | grep -v '^$' | sort -u | jq -R . | jq -c -s '. // []')
          COUNT=$(echo "$MATRIX" | jq 'length')

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo ""
          echo "Résumé :"
          echo "$SUMMARY_ROWS" | column -t -s '|'
          echo ""
          echo "Packages orphelins détectés : $COUNT"
          echo "Packages conservés (avec branche dev vivante) : ${#KEEP_PKGS[@]}"

          if [ "$DRY_RUN" = "true" ]; then
            echo ""
            echo "🔍 Dry-run : aucune suppression effectuée. Revue ci-dessus."
          fi