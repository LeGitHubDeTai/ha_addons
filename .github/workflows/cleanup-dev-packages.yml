name: Cleanup dev packages

on:
  schedule:
    # Tous les samedis à 03:00 UTC
    - cron: '0 3 * * 6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (liste sans supprimer)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  OWNER_LC: legithubdetai
  REPO_PREFIX: ha_addons

jobs:
  detect-orphans:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
      count: ${{ steps.collect.outputs.count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yq
        run: |
          if ! command -v yq >/dev/null 2>&1; then
            wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
            chmod +x /usr/local/bin/yq
          fi
          yq --version

      - name: Detect dev- packages without dev branch
        id: collect
        run: |
          set -euo pipefail

          DRY_RUN="${{ inputs.dry_run }}"
          echo "### 🧹 Cleanup dev packages (GITHUB_TOKEN uniquement)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Mode dry-run: **${DRY_RUN:-false}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "📡 Branches distantes :"
          git fetch origin --prune 2>/dev/null || true
          REMOTE_BRANCHES=$(git ls-remote --heads origin | sed -E 's|.*refs/heads/||')
          echo "$REMOTE_BRANCHES"
          echo ""

          branch_exists() {
            echo "$REMOTE_BRANCHES" | grep -Fxq "$1"
          }

          mapfile -t ADDON_DIRS < <(find . -maxdepth 2 -name "config.yaml" -exec dirname {} \; | sed 's|^\./||' | grep -v '^\.$' | sort -u)
          echo "Addons détectés : ${ADDON_DIRS[*]}"

          # Slug -> dossier (pour retrouver les archs) et set des slugs connus.
          declare -A SLUG_TO_DIR=()
          for addon_dir in "${ADDON_DIRS[@]}"; do
            SLUG=$(yq eval '.slug' "$addon_dir/config.yaml" 2>/dev/null | tr -d '"' | xargs || echo "$addon_dir")
            if [ -z "$SLUG" ] || [ "$SLUG" = "null" ]; then
              SLUG="$addon_dir"
            fi
            SLUG_TO_DIR["$SLUG"]="$addon_dir"
            # Le nom du dossier peut différer du slug (ex. FossFLOW/fossflow) :
            # on indexe les deux.
            if [ -z "${SLUG_TO_DIR[$addon_dir]:-}" ]; then
              SLUG_TO_DIR["$addon_dir"]="$addon_dir"
            fi
          done

          # Slugs déduits des branches dev distantes (ex. planka2-dev -> planka2).
          # Couvre les addons renommés/supprimés dont le package dev- existe
          # encore mais qui n'ont plus de dossier (ex. dev-planka2-*).
          BRANCH_SLUGS=$(echo "$REMOTE_BRANCHES" | sed -n -E -e 's/^(.+)-dev$/\1/p' -e 's/^dev-(.+)$/\1/p' | sort -u)

          # Union : slugs connus (dossiers) + slugs vus dans les branches.
          ALL_SLUGS=$(printf '%s\n%s\n' "$(printf '%s\n' "${!SLUG_TO_DIR[@]}")" "$BRANCH_SLUGS" | grep -v '^$' | sort -u)
          echo "Slugs candidats : $(echo "$ALL_SLUGS" | tr '\n' ' ')"

          # Construit la liste des noms de packages attendus.
          # Convention de docker-build-publish.yml :
          #   ghcr.io/<owner>/ha_addons/dev-<slug>-<arch>  => package "ha_addons/dev-<slug>-<arch>"
          # Règle de conservation stricte : on garde dev-<slug>-* UNIQUEMENT si
          # le slug a un dossier addon ET une branche dev vivante. Sinon (plus
          # de dossier, ou plus de branche) → suppression.
          PACKAGES=()
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Slug | Dossier | Branche dev | Packages ciblés |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY

          for SLUG in $ALL_SLUGS; do
            addon_dir="${SLUG_TO_DIR[$SLUG]:-}"
            if [ -n "$addon_dir" ] && [ -f "$addon_dir/config.yaml" ]; then
              ARCHS=$(yq eval '.arch[]' "$addon_dir/config.yaml" 2>/dev/null | tr '\n' ' ' || echo "amd64 aarch64")
            else
              addon_dir="(supprimé)"
              ARCHS="amd64 aarch64"
            fi

            HAS_DEV=false
            FOUND=""
            for candidate in "$SLUG-dev" "dev-$SLUG"; do
              if branch_exists "$candidate"; then
                HAS_DEV=true
                FOUND="$candidate"
                break
              fi
            done
            # Compat : teste aussi avec le nom du dossier quand il diffère du slug.
            if [ "$HAS_DEV" = false ] && [ -n "${SLUG_TO_DIR[$SLUG]:-}" ] && [ "${SLUG_TO_DIR[$SLUG]}" != "$SLUG" ]; then
              D="${SLUG_TO_DIR[$SLUG]}"
              for candidate in "$D-dev" "dev-$D"; do
                if branch_exists "$candidate"; then
                  HAS_DEV=true
                  FOUND="$candidate"
                  break
                fi
              done
            fi

            HAS_DIR=false
            if [ "$addon_dir" != "(supprimé)" ]; then
              HAS_DIR=true
            fi

            if [ "$HAS_DIR" = true ] && [ "$HAS_DEV" = true ]; then
              echo "✅ slug=$SLUG (dir=$addon_dir) : dossier + branche $FOUND → conservé"
              echo "| $SLUG | $addon_dir | ✅ \`$FOUND\` | conservés |" >> $GITHUB_STEP_SUMMARY
              continue
            fi

            if [ "$HAS_DIR" = false ]; then
              REASON="dossier supprimé"
            else
              REASON="aucune branche dev"
            fi
            echo "🗑️ slug=$SLUG (dir=$addon_dir, archs=$ARCHS) : $REASON → à supprimer"
            TARGETS=""
            for arch in $ARCHS; do
              PKG="$REPO_PREFIX/dev-$SLUG-$arch"
              PACKAGES+=("$PKG")
              TARGETS="$TARGETS \`$PKG\`"
            done
            echo "| $SLUG | $addon_dir | ❌ $REASON | $TARGETS |" >> $GITHUB_STEP_SUMMARY
          done

          # Déduplique + fabrique la matrice JSON ["pkg1","pkg2",...]
          MATRIX=$(printf '%s\n' "${PACKAGES[@]:-}" | grep -v '^$' | sort -u | jq -R . | jq -c -s '. // []')
          COUNT=$(echo "$MATRIX" | jq 'length')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo ""
          echo "Matrice ($COUNT packages) : $MATRIX"

  delete:
    runs-on: ubuntu-latest
    needs: detect-orphans
    if: needs.detect-orphans.outputs.count != '0' && inputs.dry_run != true
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect-orphans.outputs.matrix) }}
    steps:
      # Suppression sans action Node (évite le warning Node 20) et sans LIST global.
      # On interroge uniquement le package connu : s'il n'existe pas → skip propre,
      # plus d'erreur "Package not found". Fonctionne avec le seul GITHUB_TOKEN
      # si le repo a le rôle Admin sur le package (auto quand publié depuis ce repo).
      - name: Delete versions of ${{ matrix.package }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Le runner impose bash -e ; on le coupe sinon le premier `gh api`
          # en 404 fait sortir le step avec exit 1 avant le fallback.
          set +e
          set -uo pipefail
          PKG="${{ matrix.package }}"
          ENCODED=$(echo "$PKG" | sed 's|/|%2F|g')
          echo "📦 Package : $PKG (encodé : $ENCODED)"

          VERSIONS_RAW=""
          REST_404=false
          for endpoint in "/users/$OWNER_LC/packages/container/$ENCODED/versions?per_page=100" "/user/packages/container/$ENCODED/versions?per_page=100"; do
            echo "Essai : GET $endpoint"
            VERSIONS_RAW=$(gh api --paginate "$endpoint" 2>&1 || true)
            # gh --paginate sort en 1 même si une page 404 ; on détecte au contenu
            if echo "$VERSIONS_RAW" | grep -qi "not found\|404"; then
              REST_404=true
              break
            fi
            if [ -n "$VERSIONS_RAW" ] && ! echo "$VERSIONS_RAW" | grep -qi '"message"'; then
              echo "✅ Versions listées via $endpoint"
              REST_404=false
              break
            fi
            echo "→ échec :"
            echo "$VERSIONS_RAW" | head -n 10
            VERSIONS_RAW=""
          done

          if [ "$REST_404" = true ]; then
            # Avec GITHUB_TOKEN, un 404 REST est ambigu : soit le package n'existe
            # vraiment pas, soit le repo n'a pas le rôle Admin dessus (GitHub
            # masque l'existence par 404). On lève l'ambiguïté via le registre,
            # qui utilise la même auth que le push (packages:write) et répond
            # honnêtement.
            echo "ℹ️ REST → 404. Vérification via le registre GHCR..."
            echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin 2>&1 | tail -n 2 || true
            IMAGE="ghcr.io/$OWNER_LC/$PKG"
            if docker manifest inspect "$IMAGE:latest" >/dev/null 2>&1 || docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
              echo "⚠️ Le package EXISTE sur GHCR ($IMAGE) mais REST répond 404."
              echo "  → c'est un manque de droit Admin, pas une absence."
              echo "  → page du package GHCR → Settings → Manage Actions Access → ajouter le repo ha_addons en Admin, puis relance."
              exit 0
            else
              echo "ℹ️ Package absent aussi sur GHCR ($IMAGE) → vraiment jamais publié ou déjà supprimé → skip."
              exit 0
            fi
          fi

          if [ -z "$VERSIONS_RAW" ]; then
            echo "⚠️ Impossible de lister les versions. Si 403 : package GHCR → Settings → Manage Actions Access → repo ha_addons en Admin."
            exit 0
          fi

          IDS=$(echo "$VERSIONS_RAW" | jq -s 'add // [] | .[].id' 2>/dev/null || true)
          if [ -z "$IDS" ]; then
            echo "ℹ️ Aucune version à supprimer → skip."
            exit 0
          fi

          echo "Versions à supprimer :"
          echo "$IDS"
          for vid in $IDS; do
            echo "🗑️ DELETE version $vid"
            OUT=$(gh api --method DELETE "/users/$OWNER_LC/packages/container/$ENCODED/versions/$vid" 2>&1 || \
               gh api --method DELETE "/user/packages/container/$ENCODED/versions/$vid" 2>&1)
            STATUS=$?
            if [ $STATUS -eq 0 ]; then
              echo "  ✅ version $vid supprimée"
            elif echo "$OUT" | grep -qi "last tagged version.*delete the package instead"; then
              echo "  ℹ️ Dernière version taguée : suppression du package entier requise."
              break
            else
              echo "  ⚠️ échec version $vid (continue) :"
              echo "$OUT" | head -n 5
            fi
          done

          # Supprime le package entier (requis quand il ne reste que la dernière
          # version taguée ; GitHub refuse DELETE version dans ce cas avec 400).
          echo "🗑️ DELETE package $PKG"
          DEL_OUT=$(gh api --method DELETE "/users/$OWNER_LC/packages/container/$ENCODED" 2>&1 || \
             gh api --method DELETE "/user/packages/container/$ENCODED" 2>&1 || true)
          echo "$DEL_OUT" | head -n 10

          # Vérification réelle : le DELETE peut répondre 204 sans que le package
          # disparaisse (ex. droits insuffisants, soft-delete). On re-GET.
          sleep 5
          CHECK=$(gh api "/users/$OWNER_LC/packages/container/$ENCODED" 2>&1 || true)
          if echo "$CHECK" | grep -qi "not found\|404"; then
            echo "  ✅ package $PKG confirmé supprimé (GET → 404)."
          else
            echo "  ⚠️ package $PKG TOUJOURS PRÉSENT après DELETE — suppression non effective :"
            echo "$CHECK" | head -n 20
            echo "  Causes probables : GITHUB_TOKEN sans rôle Admin sur ce package,"
            echo "  ou package restaurable (soft-delete 30j). Voir Settings du package → Manage Actions Access."
          fi
          echo "✅ Terminé pour $PKG"

  summary:
    runs-on: ubuntu-latest
    needs: [detect-orphans, delete]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Résultat nettoyage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Packages orphelins détectés : **${{ needs.detect-orphans.outputs.count }}**" >> $GITHUB_STEP_SUMMARY
          echo "Résultat delete : **${{ needs.delete.result }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "🔍 Dry-run : aucune suppression effectuée." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Si un delete échoue en 403 / Package not found : page du package GHCR → Settings → Manage Actions Access → ajouter le repo \`ha_addons\` avec le rôle \`Admin\`. C'est ce qui donne au \`GITHUB_TOKEN\` le droit de supprimer sans PAT._" >> $GITHUB_STEP_SUMMARY
