name: Auto-upgrade ctfreak

# Workflow to automatically upgrade ctfreak addon when new Docker Hub tags are available.
# CTFREAK is proprietary software: no GitHub releases, version is the image tag
# in ctfreak/build.yaml (jypsoftware/ctfreak:X.Y.Z).
on:
  schedule:
    # Run daily at 12:00 PM UTC
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force recreate PR even if one already exists (closed/merged)'
        required: false
        default: true
        type: boolean

jobs:
  auto-upgrade:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current versions
        id: current
        run: |
          # Get ctfreak version from build.yaml (image tag)
          BUILD_VERSION=$(grep -E 'jypsoftware/ctfreak:' ctfreak/build.yaml | head -1 | sed 's/.*ctfreak://' | sed 's/[[:space:]]*//')
          echo "build_version=$BUILD_VERSION" >> $GITHUB_OUTPUT

          # Get addon version from config.yaml
          CONFIG_VERSION=$(grep -E '^version:' ctfreak/config.yaml | sed 's/version: "//' | sed 's/"//')
          echo "config_version=$CONFIG_VERSION" >> $GITHUB_OUTPUT

          echo "Current ctfreak version: $BUILD_VERSION"
          echo "Current addon version: $CONFIG_VERSION"

      - name: Get latest ctfreak tag from Docker Hub
        id: latest
        run: |
          # List tags from Docker Hub and find the latest valid semver (X.Y.Z)
          TAGS_DATA=$(curl -fsSL "https://hub.docker.com/v2/repositories/jypsoftware/ctfreak/tags?page_size=100")

          LATEST_TAG=$(echo "$TAGS_DATA" | jq -r '.results[].name' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)

          if [ -z "$LATEST_TAG" ]; then
            echo "No valid semver tag found on Docker Hub"
            exit 1
          fi

          echo "latest_version=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "release_url=https://hub.docker.com/r/jypsoftware/ctfreak/tags" >> $GITHUB_OUTPUT
          echo "release_type=latest" >> $GITHUB_OUTPUT

          echo "Latest ctfreak tag: $LATEST_TAG"

      - name: Compare versions and check existing PRs
        id: compare
        run: |
          CURRENT_CTFREAK_VERSION="${{ steps.current.outputs.build_version }}"
          LATEST_VERSION="${{ steps.latest.outputs.latest_version }}"

          # Check if this is a new version
          IS_NEW_VERSION=false
          if [ "$(printf '%s\n' "$LATEST_VERSION" "$CURRENT_CTFREAK_VERSION" | sort -V | head -n1)" = "$CURRENT_CTFREAK_VERSION" ] && [ "$CURRENT_CTFREAK_VERSION" != "$LATEST_VERSION" ]; then
            IS_NEW_VERSION=true
          fi

          if [ "$IS_NEW_VERSION" = "true" ]; then
            echo "needs_upgrade=true" >> $GITHUB_OUTPUT
            echo "is_new_version=true" >> $GITHUB_OUTPUT
            echo "New ctfreak version available: $LATEST_VERSION (current: $CURRENT_CTFREAK_VERSION)"
          else
            echo "needs_upgrade=false" >> $GITHUB_OUTPUT
            echo "is_new_version=false" >> $GITHUB_OUTPUT
            echo "Already up-to-date or no new version"
          fi

      - name: Generate new addon version
        id: addon_version
        if: steps.compare.outputs.needs_upgrade == 'true'
        run: |
          # Get current year and month in correct format
          CURRENT_YEAR=$(date +%y)  # YY format (26 for 2026)
          CURRENT_MONTH=$(date +%m)  # MM format
          CURRENT_MONTH=${CURRENT_MONTH#0}  # Remove leading zero

          # Get current addon version and extract the patch number
          CURRENT_ADDON_VERSION="${{ steps.current.outputs.config_version }}"
          CURRENT_PATCH=$(echo $CURRENT_ADDON_VERSION | cut -d. -f3)

          # If year.month changed, reset patch to 1, otherwise increment
          CURRENT_YEAR_MONTH=$(echo $CURRENT_ADDON_VERSION | cut -d. -f1,2)
          NEW_YEAR_MONTH="$CURRENT_YEAR.$CURRENT_MONTH"

          if [ "$CURRENT_YEAR_MONTH" = "$NEW_YEAR_MONTH" ]; then
            # Same month, increment patch
            NEW_PATCH=$((CURRENT_PATCH + 1))
          else
            # New month, reset patch to 1
            NEW_PATCH=1
          fi

          NEW_ADDON_VERSION="$NEW_YEAR_MONTH.$NEW_PATCH"
          echo "new_addon_version=$NEW_ADDON_VERSION" >> $GITHUB_OUTPUT
          echo "New addon version: $NEW_ADDON_VERSION"

      - name: Create or checkout upgrade branch
        id: branch
        if: steps.compare.outputs.needs_upgrade == 'true'
        run: |
          BRANCH_NAME="upgrade/ctfreak-v${{ steps.latest.outputs.latest_version }}"

          # Check if branch exists on remote
          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            echo "Branch $BRANCH_NAME exists on remote, checking it out..."
            git fetch origin "$BRANCH_NAME"
            git checkout -B "$BRANCH_NAME" origin/"$BRANCH_NAME"
          else
            echo "Creating new branch $BRANCH_NAME..."
            git checkout -b "$BRANCH_NAME"
          fi

          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Update config.yaml and build.yaml
        if: steps.compare.outputs.needs_upgrade == 'true' && (steps.compare.outputs.is_new_version == 'true' || github.event.inputs.force == 'true')
        run: |
          # Update addon version in config.yaml
          sed -i "s/^version: .*/version: \"${{ steps.addon_version.outputs.new_addon_version }}\"/" ctfreak/config.yaml
          echo "Updated config.yaml version to ${{ steps.addon_version.outputs.new_addon_version }}"

          # Update image tag in build.yaml
          sed -i "s|jypsoftware/ctfreak:.*|jypsoftware/ctfreak:${{ steps.latest.outputs.latest_version }}|" ctfreak/build.yaml
          echo "Updated build.yaml image tag to ${{ steps.latest.outputs.latest_version }}"

      - name: Commit changes
        if: steps.compare.outputs.needs_upgrade == 'true' && (steps.compare.outputs.is_new_version == 'true' || github.event.inputs.force == 'true')
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ctfreak/config.yaml ctfreak/build.yaml
          FORCE_FLAG="${{ github.event.inputs.force }}"

          # Check if there are changes to commit
          if git diff --cached --quiet; then
            if [ "$FORCE_FLAG" = "true" ]; then
              echo "No changes but force flag is set - creating empty commit"
              git commit --allow-empty -m "🔼 Upgrade ctfreak to ${{ steps.latest.outputs.latest_version }} (addon ${{ steps.addon_version.outputs.new_addon_version }})"
            else
              echo "No changes to commit - ctfreak version is already up to date on this branch"
              exit 0
            fi
          else
            git commit -m "🔼 Upgrade ctfreak to ${{ steps.latest.outputs.latest_version }} (addon ${{ steps.addon_version.outputs.new_addon_version }})"
          fi

      - name: Push branch
        if: steps.compare.outputs.needs_upgrade == 'true' && (steps.compare.outputs.is_new_version == 'true' || github.event.inputs.force == 'true')
        run: |
          BRANCH_NAME="${{ steps.branch.outputs.branch_name }}"
          FORCE_FLAG="${{ github.event.inputs.force }}"

          # Fetch to ensure we have latest remote info
          git fetch origin || true

          # Check if there are commits to push (avoids error when no changes)
          # Skip this check if force flag is set - always push when forced
          if [ "$FORCE_FLAG" = "true" ]; then
            echo "Force flag set - pushing branch unconditionally..."
            git push origin "$BRANCH_NAME" --force
          elif git rev-parse origin/"$BRANCH_NAME" >/dev/null 2>&1; then
            # Branch exists remotely - check if we have new commits
            if [ -n "$(git log origin/"$BRANCH_NAME"..HEAD 2>/dev/null)" ]; then
              echo "New commits found - pushing updates..."
              git push origin "$BRANCH_NAME" --force
            else
              echo "No new commits to push - branch is up to date"
            fi
          else
            # Branch doesn't exist on remote yet
            echo "Creating new branch $BRANCH_NAME on remote..."
            git push origin "$BRANCH_NAME"
          fi

      - name: Setup GitHub CLI
        if: steps.compare.outputs.needs_upgrade == 'true'
        uses: wusatosi/setup-gh@v1

      - name: Create or Update Pull Request
        if: steps.compare.outputs.needs_upgrade == 'true'
        run: |
          # Debug: show current branch and repo info
          echo "Current branch: $(git branch --show-current)"
          echo "Remote URL: $(git remote get-url origin)"

          LATEST_VERSION="${{ steps.latest.outputs.latest_version }}"
          NEW_ADDON_VERSION="${{ steps.addon_version.outputs.new_addon_version }}"
          BRANCH_NAME="${{ steps.branch.outputs.branch_name }}"
          IS_NEW_VERSION="${{ steps.compare.outputs.is_new_version }}"

          FORCE_FLAG="${{ github.event.inputs.force || 'true' }}"

          # Check for open PR
          OPEN_PR=$(gh pr list --head "$BRANCH_NAME" --base main --state open --json number --jq '.[0].number')
          # Check for any PR (open or closed) to avoid duplicates
          ANY_PR=$(gh pr list --head "$BRANCH_NAME" --base main --state all --json number --jq '.[0].number')

          if [ -n "$OPEN_PR" ]; then
            echo "Open PR #$OPEN_PR found, updating..."

            # Update title
            if [ "$IS_NEW_VERSION" = "true" ]; then
              gh pr edit "$OPEN_PR" --title "🔼 Upgrade ctfreak to $LATEST_VERSION (addon $NEW_ADDON_VERSION)"
              echo "Updated PR title"
            fi

            echo "PR #$OPEN_PR updated successfully"
          elif [ "$FORCE_FLAG" = "true" ]; then
            echo "Force flag is set - creating new PR even if one existed before..."
            # Create pull request using gh CLI (forced)
            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "🔼 Upgrade ctfreak to $LATEST_VERSION (addon $NEW_ADDON_VERSION)" \
              --body "Auto-upgrade ctfreak to version $LATEST_VERSION

            **Changes:**
            - Updated config.yaml addon version to $NEW_ADDON_VERSION
            - Updated build.yaml to use jypsoftware/ctfreak:$LATEST_VERSION

            **Release:** ${{ steps.latest.outputs.release_url }}

            This PR was created automatically by the auto-upgrade workflow (forced recreation)." \
              --label "auto-upgrade,dependencies,latest"

            echo "PR created successfully (forced)"
          elif [ -n "$ANY_PR" ]; then
            echo "PR #$ANY_PR already exists but is closed/merged - not creating duplicate (use 'force' to recreate)"
          elif [ "$IS_NEW_VERSION" = "true" ]; then
            # Create pull request using gh CLI (only for new versions)
            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "🔼 Upgrade ctfreak to $LATEST_VERSION (addon $NEW_ADDON_VERSION)" \
              --body "Auto-upgrade ctfreak to version $LATEST_VERSION

            **Changes:**
            - Updated config.yaml addon version to $NEW_ADDON_VERSION
            - Updated build.yaml to use jypsoftware/ctfreak:$LATEST_VERSION

            **Release:** ${{ steps.latest.outputs.release_url }}

            This PR was created automatically by the auto-upgrade workflow." \
              --label "auto-upgrade,dependencies,latest"

            echo "PR created successfully"
          else
            echo "No new version and no open PR - nothing to do"
          fi
