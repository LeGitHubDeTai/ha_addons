name: Lidarr Develop
version: "26.9.1"
slug: lidarr_develop
description: Gestionnaire de collection musicale — branche develop (pré-version instable)
url: https://github.com/LeGitHubDeTai/ha_addons/tree/main/lidarr_develop
webui: http://[HOST]:[PORT:8686]/
image: ghcr.io/legithubdetai/ha_addons/lidarr_develop-{arch}
arch:
    - amd64
    - aarch64
startup: application
boot: auto
init: false
apparmor: true
panel_icon: "mdi:test-tube"
panel_title: Lidarr Develop
ingress: false
backup_exclude:
    - "logs/*"
    - "MediaCover/*"
    - "*.db-shm"
    - "*.db-wal"
map:
    - type: addon_config
      read_only: false
      path: /config
    - type: share
      read_only: false
      path: /share
    - type: media
      read_only: false
      path: /media
    - type: backup
      read_only: false
      path: /backup
environment:
    PUID: "0"
    PGID: "0"
    TZ: Europe/Paris
ports:
    8686/tcp: 8687
ports_description:
    8686/tcp: "Interface web Lidarr, exposée directement sur le réseau local (port hôte 8687 par défaut pour coexister avec la version stable)."
options:
    PUID: 0
    PGID: 0
    TZ: Europe/Paris
schema:
    PUID: int
    PGID: int
    TZ: str
