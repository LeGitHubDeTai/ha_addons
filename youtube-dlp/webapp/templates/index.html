<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube-DLP - Téléchargeur de vidéos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; color: #ff0000; margin: 20px 0; }
        h2 { color: #e94560; margin-bottom: 10px; }
        .card { background: #16213e; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        input[type="url"] { width: 100%; padding: 12px; border: 2px solid #0f3460; border-radius: 8px; background: #0a0a1a; color: #eee; font-size: 14px; margin-bottom: 10px; }
        input[type="url"]:focus { border-color: #e94560; outline: none; }
        select, button { padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
        select { background: #0f3460; color: #eee; margin-right: 8px; }
        button { background: #e94560; color: white; font-weight: bold; }
        button:hover { background: #c73652; }
        button:disabled { background: #555; cursor: not-allowed; }
        .btn-cancel { background: #ff6b6b; }
        .btn-delete { background: #dc3545; padding: 6px 12px; font-size: 12px; }
        .btn-delete:hover { background: #c82333; }
        .download-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
        .download-form > div { flex: 1; min-width: 200px; }
        .download-form label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
        .status-bar { padding: 8px 12px; border-radius: 6px; margin-top: 10px; font-size: 13px; }
        .status-downloading { background: #1a3a5c; color: #4fc3f7; }
        .status-completed { background: #1a3c1a; color: #4caf50; }
        .status-error { background: #3c1a1a; color: #f44336; }
        .status-cancelled { background: #3c3c1a; color: #ff9800; }
        .progress-bar { width: 100%; height: 6px; background: #0a0a1a; border-radius: 3px; margin-top: 6px; overflow: hidden; }
        .progress-fill { height: 100%; background: #e94560; border-radius: 3px; transition: width 0.3s; }
        .files-list { list-style: none; }
        .files-list li { padding: 10px; background: #0a0a1a; border-radius: 6px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        .files-list li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 10px; }
        .files-list .size { color: #aaa; font-size: 12px; white-space: nowrap; }
        .refresh-btn { background: #0f3460; color: white; margin-left: 10px; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .stats { color: #aaa; font-size: 13px; }
        .empty-state { text-align: center; color: #666; padding: 40px; }
        @media (max-width: 600px) { .download-form > div { min-width: 100%; } }
    </style>
</head>
<body>
<div class="container">
    <h1>🎬 YouTube-DLP</h1>

    <div class="card">
        <h2>Nouveau téléchargement</h2>
        <form id="downloadForm" class="download-form" onsubmit="return false;">
            <div style="flex:2">
                <label>URL de la vidéo</label>
                <input type="url" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." required>
            </div>
            <div style="flex:1">
                <label>Format</label>
                <select id="format">
                    <option value="best">Meilleure qualité (MP4)</option>
                    <option value="mp4">MP4 uniquement</option>
                    <option value="audio">Audio uniquement (MP3)</option>
                </select>
            </div>
            <div style="flex:0">
                <label>&nbsp;</label>
                <button type="submit" id="downloadBtn">Télécharger</button>
            </div>
        </form>
    </div>

    <div class="card">
        <div class="header-row">
            <h2>Téléchargements actifs</h2>
            <span class="stats" id="activeCount"></span>
        </div>
        <div id="activeDownloads"></div>
    </div>

    <div class="card">
        <div class="header-row">
            <h2>Fichiers téléchargés</h2>
            <button class="refresh-btn" onclick="loadFiles()">🔄</button>
        </div>
        <ul class="files-list" id="filesList"></ul>
    </div>
</div>

<script>
const API_BASE = '';
const POLL_INTERVAL = 3000;

function renderDownload(task) {
    const statusClass = 'status-' + task.status;
    const progress = task.progress || 0;
    let html = `<div class="status-bar ${statusClass}">`;
    html += `<strong>${escapeHtml(task.url)}</strong> - ${task.status}`;
    html += `<div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>`;
    html += `</div>`;
    if (task.status === 'downloading') {
        html += `<button class="btn-cancel" onclick="cancelDownload('${task.id}')">Annuler</button>`;
    }
    return `<div style="margin-bottom:10px;">${html}</div>`;
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function loadActive() {
    fetch(API_BASE + '/active')
        .then(r => r.json())
        .then(tasks => {
            const container = document.getElementById('activeDownloads');
            const count = Object.keys(tasks).length;
            document.getElementById('activeCount').textContent = `${count} tâche(s)`;
            if (count === 0) {
                container.innerHTML = '<div class="empty-state">Aucun téléchargement actif</div>';
                return;
            }
            container.innerHTML = Object.values(tasks).map(renderDownload).join('');
        });
}

function loadFiles() {
    fetch(API_BASE + '/files')
        .then(r => r.json())
        .then(data => {
            const list = document.getElementById('filesList');
            if (data.files.length === 0) {
                list.innerHTML = '<div class="empty-state">Aucun fichier trouvé</div>';
                return;
            }
            list.innerHTML = data.files.map(f => {
                const size = '';
                return `<li><span title="${escapeHtml(f)}">${escapeHtml(f)}</span><span class="size">${size}</span><button class="btn-delete" onclick="deleteFile('${escapeHtml(f)}')">Supprimer</button></li>`;
            }).join('');
        });
}

function cancelDownload(id) {
    fetch(API_BASE + '/cancel/' + id, {method: 'POST'})
        .then(() => loadActive());
}

function deleteFile(filename) {
    if (!confirm('Supprimer ' + filename + ' ?')) return;
    fetch(API_BASE + '/delete/' + encodeURIComponent(filename), {method: 'POST'})
        .then(() => loadFiles());
}

document.getElementById('downloadForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const url = document.getElementById('videoUrl').value.trim();
    const format = document.getElementById('format').value;
    if (!url) return;
    const btn = document.getElementById('downloadBtn');
    btn.disabled = true;
    btn.textContent = 'Envoi...';
    fetch(API_BASE + '/download', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({url, format})
    }).then(r => r.json()).then(data => {
        btn.disabled = false;
        btn.textContent = 'Télécharger';
        document.getElementById('videoUrl').value = '';
        loadActive();
    }).catch(() => { btn.disabled = false; btn.textContent = 'Télécharger'; });
});

setInterval(loadActive, POLL_INTERVAL);
loadActive();
loadFiles();
</script>
</body>
</html>
