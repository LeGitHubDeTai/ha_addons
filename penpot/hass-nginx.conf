worker_processes 1;
error_log /dev/stdout info;
pid /run/hass-nginx.pid;

events {
    worker_connections 128;
}

http {
    access_log /dev/stdout;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    client_header_timeout 900s;
    client_body_timeout 900s;
    send_timeout 900s;
    keepalive_timeout 900s;

    proxy_connect_timeout 900s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;

    client_max_body_size 0;

    server {
        server_name 0.0.0.0;
        listen 9001;

        # Direct access (no HA Ingress for Penpot): open to the LAN.
        # Put Penpot behind a reverse-proxy / VPN if you expose HA to the internet.

        location / {
            # 127.0.0.1 explicite : évite la tentative IPv6 (::1) refusée
            # quand localhost se résout en ::1 en premier
            proxy_pass http://127.0.0.1:8080/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket support (Penpot live collaboration)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Origin $scheme://$host;
            proxy_cache off;
            proxy_buffering off;

            # CORS headers for ingress
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin" always;
            add_header Access-Control-Allow-Credentials "true" always;

            if ($request_method = OPTIONS) {
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }
    }
}
