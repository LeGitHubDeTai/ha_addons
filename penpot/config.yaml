name: Penpot
version: "26.9.7"
slug: penpot
panel_icon: "mdi:pen-plus"
description: Plateforme open-source de design & prototypage (Penpot)
url: https://github.com/LeGitHubDeTai/ha_addons/tree/main/penpot
webui: http://[HOST]:[PORT:9001]/
image: ghcr.io/legithubdetai/ha_addons/penpot-{arch}
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
hassio_role: "default"
hassio_api: true
homeassistant_api: true
# NOTE: pas d'Ingress HA — Penpot construit ses URL d'API en absolu depuis
# l'URI publique et ne supporte pas les sous-chemins dynamiques de l'Ingress.
# L'accès se fait en direct sur le port 9001.
ports:
  9001/tcp: 9001
ports_description:
  9001/tcp: Penpot Web UI (accès direct, ex. http://homeassistant.local:9001)
backup_exclude:
  - "penpot/*.log"
  - "supervisord.log*"
options:
  timezone: "Europe/Paris"
  secret_key: ""
  public_uri: ""
  allow_registration: true
  disable_telemetry: true
  DATABASE:
    db_host: ""
    db_port: 5432
    db_user: penpot
    db_password: ""
    db_name: penpot
  REDIS:
    redis_host: "localhost"
    redis_port: 6379
    redis_db: 0
  smtp_host: ""
  smtp_port: 587
  smtp_username: ""
  smtp_password: ""
  smtp_from: "no-reply@example.com"
  smtp_reply_to: "no-reply@example.com"
schema:
  timezone: str
  secret_key: str?
  public_uri: str?
  allow_registration: bool
  disable_telemetry: bool
  DATABASE:
    db_host: str
    db_port: int
    db_user: str
    db_password: password
    db_name: str
  REDIS:
    redis_host: str
    redis_port: int
    redis_db: int
  smtp_host: str?
  smtp_port: int?
  smtp_username: str?
  smtp_password: str?
  smtp_from: str?
  smtp_reply_to: str?
