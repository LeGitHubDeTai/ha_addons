# Deemix derrière nginx : port public 6595 (direct + Home Assistant Ingress),
# application Express + WebSocket en interne sur 127.0.0.1:6596.
user nginx;
worker_processes auto;
error_log /dev/stderr info;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 0;

    access_log /dev/stdout;

    # Map pour gérer correctement WebSocket vs HTTP keep-alive.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 6595;
        server_name _;

        # Téléchargements (albums, discographies) potentiellement longs
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;

        # Pas de buffering : streaming des (gros) fichiers + temps réel WS
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;

        # Chemin d'ingress envoyé par le Supervisor Home Assistant,
        # ex : /api/hassio_ingress/xxxx. Vide en accès direct :6595.
        set $ingress_path $http_x_ingress_path;

        location / {
            proxy_pass http://127.0.0.1:6596;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Origin $scheme://$http_host;

            # Désactive gzip côté backend pour que sub_filter puisse
            # réécrire les chemins absolus dans HTML/JS.
            proxy_set_header Accept-Encoding "";

            proxy_cache off;

            # Réécriture des chemins absolus vers le préfixe ingress.
            # Sans ça, les assets (/assets/...), l'API (/api/...) et le
            # WebSocket sortent de l'ingress et échouent en 404.
            # Quand $ingress_path est vide (accès direct :6595), les
            # remplacements sont neutres ("/..." -> "/...").
            # text/html est déjà le type par défaut de sub_filter : on ne liste
            # que les types supplémentaires (sinon warning "duplicate MIME type").
            sub_filter_types text/css application/javascript application/json;
            sub_filter_once off;
            sub_filter 'href="/'  'href="$ingress_path/';
            sub_filter 'src="/'   'src="$ingress_path/';
            sub_filter 'action="/' 'action="$ingress_path/';
            sub_filter 'srcset="/' 'srcset="$ingress_path/';
            sub_filter 'url("/'   'url("$ingress_path/';
            sub_filter "url('/"   "url('$ingress_path/";
            sub_filter '"/api/'   '"$ingress_path/api/';
            sub_filter "'/api/"   "'$ingress_path/api/";
            sub_filter '"/assets/' '"$ingress_path/assets/';
            sub_filter "'/assets/" "'$ingress_path/assets/";
            sub_filter '"/res/'    '"$ingress_path/res/';
            sub_filter "'/res/"    "'$ingress_path/res/";
        }
    }
}
