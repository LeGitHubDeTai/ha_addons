user  nginx;
worker_processes  auto;
error_log /dev/stderr info;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 0;

    access_log /dev/stdout;

    # Map pour gerer correctement WebSocket vs HTTP keep-alive.
    # L'ancienne config forcait toujours "upgrade", ce qui cassait
    # les requetes HTTP normales (API, /images, etc.).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 50145;
        server_name _;

        # Timeouts longs : WebSocket (ping toutes les ~54s cote isoman)
        # + gros telechargements ISO via /images/.
        proxy_connect_timeout 30s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        send_timeout 86400s;

        # Pas de limite memoire/buffer pour les gros fichiers ISO
        proxy_max_temp_file_size 0;

        # Chemin d'ingress envoye par Home Assistant Supervisor,
        # ex: /api/hassio_ingress/xxxx. Vide en acces direct :8080.
        set $ingress_path $http_x_ingress_path;

        # --- WebSocket temps reel (progression downloads) ---
        location = /ws {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin $scheme://$http_host;

            proxy_cache off;
            proxy_buffering off;
        }

        # --- API REST ---
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache off;
            proxy_buffering off;

            # Laisse passer les gros JSON sans les tronquer
            proxy_buffers 8 32k;
            proxy_buffer_size 32k;
        }

        # --- Fichiers ISO + directory listing (/images/) ---
        # Gros fichiers : pas de buffering, timeouts longs.
        location /images/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache off;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # --- Frontend + reste (/, /health, /static/, /isos, /stats, ...) ---
        location / {
            proxy_pass http://127.0.0.1:8080;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Origin $scheme://$http_host;

            # Desactive gzip cote backend pour que sub_filter puisse
            # reecrire les chemins absolus dans HTML/JS.
            proxy_set_header Accept-Encoding "";

            proxy_cache off;
            proxy_buffering off;

            # Reecriture des chemins absolus vers le prefixe ingress.
            # Sans ca, fetch("/api/..."), new WebSocket("/ws") et
            # href="/images/..." sortent de l'ingress et echouent en 404.
            # Quand $ingress_path est vide (acces direct :8080), les
            # remplacements sont neutres ("/..." -> "/...").
            sub_filter_types text/html text/css application/javascript application/json;
            sub_filter_once off;
            sub_filter 'href="/'  'href="$ingress_path/';
            sub_filter 'src="/'   'src="$ingress_path/';
            sub_filter 'action="/' 'action="$ingress_path/';
            sub_filter 'srcset="/' 'srcset="$ingress_path/';
            sub_filter 'url("/'   'url("$ingress_path/';
            sub_filter "url('/"   "url('$ingress_path/";
            sub_filter '"/api/'   '"$ingress_path/api/';
            sub_filter "'/api/"   "'$ingress_path/api/";
            sub_filter '"/ws"'    '"$ingress_path/ws"';
            sub_filter "'/ws'"    "'$ingress_path/ws'";
            sub_filter '"/images/' '"$ingress_path/images/';
            sub_filter "'/images/" "'$ingress_path/images/";
            sub_filter '"/health"' '"$ingress_path/health"';
            sub_filter "'/health'" "'$ingress_path/health'";
            sub_filter '"/static/' '"$ingress_path/static/';
            sub_filter "'/static/" "'$ingress_path/static/";
        }
    }
}
