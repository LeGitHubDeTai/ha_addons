name: Lidarr Nightly
version: "26.9.1"
slug: lidarr_nightly
description: Gestionnaire de collection musicale — branche nightly (builds quotidiens instables)
url: https://github.com/LeGitHubDeTai/ha_addons/tree/main/lidarr_nightly
webui: http://[HOST]:[PORT:8686]/
image: ghcr.io/legithubdetai/ha_addons/lidarr_nightly-{arch}
arch:
    - amd64
    - aarch64
startup: application
boot: auto
init: false
apparmor: true
panel_icon: "mdi:weather-night"
panel_title: Lidarr Nightly
ingress: true
ingress_port: 8686
backup_exclude:
    - "logs/*"
    - "MediaCover/*"
    - "*.db-shm"
    - "*.db-wal"
map:
    - type: addon_config
      read_only: false
      path: /config
    - type: share
      read_only: false
      path: /share
    - type: media
      read_only: false
      path: /media
    - type: backup
      read_only: false
      path: /backup
environment:
    PUID: "0"
    PGID: "0"
    TZ: Europe/Paris
ports:
    8686/tcp: null
ports_description:
    8686/tcp: "Interface web Lidarr. Normalement non exposée, Home Assistant Ingress est recommandé. Exposez ce port pour un accès direct (par ex. intégration avec Prowlarr ou vos clients de téléchargement). Attention : un seul add-on Lidarr à la fois peut exposer le port 8686 de l'hôte."
options:
    PUID: 0
    PGID: 0
    TZ: Europe/Paris
schema:
    PUID: int
    PGID: int
    TZ: str
