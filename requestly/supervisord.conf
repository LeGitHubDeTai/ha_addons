[supervisord]
user=root
nodaemon=true
loglevel=info
logfile_maxbytes=1000000
logfile_backups=1

[program:nginx]
command=nginx -g "daemon off;"
autorestart=unexpected
# Ne JAMAIS mettre /dev/stdout ici : supervisord tente un rollover (seek) sur
# ce pipe et boucle en "CRIT ... Invalid seek" en fermant le canal de capture.
# NONE = nginx herite direct du stdout/stderr du conteneur, visible dans les
# logs de l'add-on HA (et indispensable pour debugger l'ingress).
stdout_logfile=NONE
stderr_logfile=NONE
user=root
