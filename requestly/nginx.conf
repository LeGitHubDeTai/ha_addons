worker_processes  1;
error_log /dev/stdout info;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 3000;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # --- Ingress Home Assistant -----------------------------------------
        # Cas nominal : le Supervisor RETIRE le prefixe
        # /api/hassio_ingress/<slug>/ avant de transmettre la requete, nginx
        # recoit donc des chemins propres (/, /assets/...) dans les deux modes.
        # Le rewrite ci-dessous n'est qu'un filet de securite, au cas ou un
        # prefixe /ingress/<token> arriverait quand meme jusqu'ici.
        # En revanche le NAVIGATEUR voit l'URL complete sous ingress : les URL
        # absolues (/assets/...) doivent donc etre re-prefixees dans les
        # reponses, via sub_filter + X-Ingress-Path
        # (X-Ingress-Path = /api/hassio_ingress/<slug>, vide en acces direct
        # ou les remplacements sont alors neutres : "/..." -> "/...").
        set $ingress_path $http_x_ingress_path;

        if ($http_x_ingress_path != "") {
            rewrite ^/ingress/[^/]+(.*)$ $1 last;
        }

        # text/html est inclus d'office par le module (le repeter ici declenche
        # un warning "duplicate MIME type" au demarrage) : on ajoute seulement
        # les types des assets.
        sub_filter_types text/css application/javascript text/javascript application/json;
        sub_filter_once off;
        # Bundle Vite + chunks dynamiques (import("/assets/...") dans le JS) :
        sub_filter '"/assets/' '"$ingress_path/assets/';
        sub_filter "'/assets/" "'$ingress_path/assets/";
        sub_filter '`/assets/' '`$ingress_path/assets/';
        # url() dans le CSS (variantes non quotee et quotees) :
        sub_filter 'url(/assets/' 'url($ingress_path/assets/';
        sub_filter 'url("/assets/' 'url("$ingress_path/assets/';
        sub_filter "url('/assets/" "url('$ingress_path/assets/";
        # PWA / favicon :
        sub_filter '"/favicon.png' '"$ingress_path/favicon.png';
        sub_filter "'/favicon.png" "'$ingress_path/favicon.png";
        sub_filter '"/manifest.json' '"$ingress_path/manifest.json';
        sub_filter "'/manifest.json" "'$ingress_path/manifest.json";
        # ----------------------------------------------------------------------

        # SPA : toute route inconnue -> index.html
        location / {
            try_files $uri $uri/ /index.html;

            # HTML jamais fige en cache : les assets sont hashe, un index.html
            # perime casserait l'apres-mise-a-jour de l'add-on.
            expires -1;
        }

        # Cache agressif sur les assets versionnés de Vite.
        # =404 (et non fallback index.html) : un chunk manquant doit echouer
        # proprement en 404, pas renvoyer du HTML qui casserait le parse JS.
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }
    }
}
