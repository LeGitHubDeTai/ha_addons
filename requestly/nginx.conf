worker_processes  1;
error_log /dev/stdout info;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 3000;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # --- Ingress Home Assistant -----------------------------------------
        # HA sert l'add-on sous /api/hassio_ingress/<token>/ mais le proxy retire
        # ce prefixe avant d'atteindre nginx : le conteneur ne voit que /assets/...
        # Le navigateur, lui, construit les URL a partir de la racine du site, donc
        # sans reecriture il demanderait /assets/... a Home Assistant lui-meme
        # (404, CSS refuse en text/plain, app bloquee sur l'ecran de chargement).
        # X-Ingress-Path (= /api/hassio_ingress/<token>) est pose par HA core ;
        # il est vide en acces direct sur le port 3000, ou la reecriture est inutile.
        set $ingress_path $http_x_ingress_path;

        # text/html est deja le defaut du module (le lister a nouveau fait crier
        # nginx : "duplicate MIME type") — on ne precise que les types des assets.
        sub_filter_types text/css application/javascript text/javascript;
        sub_filter_once off;
        sub_filter '"/assets/' '"$ingress_path/assets/';
        sub_filter "'/assets/" "'$ingress_path/assets/";
        sub_filter '`/assets/' '`$ingress_path/assets/';
        sub_filter 'url(/assets/' 'url($ingress_path/assets/';
        sub_filter '"/favicon.png' '"$ingress_path/favicon.png';
        sub_filter '"/manifest.json' '"$ingress_path/manifest.json';
        # ----------------------------------------------------------------------

        # SPA : toute route inconnue -> index.html
        location / {
            try_files $uri $uri/ /index.html;

            # HTML jamais fige en cache : les assets sont hashe, un index.html
            # perime casserait l'apres-mise-a-jour de l'add-on.
            expires -1;
        }

        # Cache agressif sur les assets versionnés de Vite
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }
    }
}
