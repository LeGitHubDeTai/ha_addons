# Reverse proxy devant Kanzo (Dockerfile : nginx 4243 -> kanzo 127.0.0.1:4242).
#
# Le port conteneur 4243 sert à la fois d'Ingress Home Assistant (non publié
# par défaut) et d'accès réseau direct (publié sur le port hôte de l'add-on).
#
# Kanzo vérifie lui-même le header Host (localhost / IP / noms de la machine,
# port = 4242) et Origin (anti DNS-rebinding et CSRF), mais l'Ingress HA
# transmet Host/Origin du navigateur (ex. https://homeassistant.local:8123).
# nginx présente donc à Kanzo une identité fixe localhost:4242, après avoir
# reproduit ses contrôles sur les vrais en-têtes. L'Ingress est reconnu par
# X-Ingress-Path, posé par HA core après filtrage ; un client qui voudrait le
# forcer depuis un autre site déclencherait un preflight OPTIONS que nginx ne
# sert pas (aucune réponse CORS), la requête n'est donc jamais envoyée.

worker_processes 1;
error_log /dev/stdout info;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    # Images jusqu'à 25 MiB (IMAGE_LIMIT de Kanzo).
    client_max_body_size 32m;

    # sub_filter réécrit les réponses : uniquement du texte non compressé.
    gzip off;

    # Préfixe d'Ingress injecté dans les URLs relatives (vide hors Ingress).
    map $http_x_ingress_path $ingress_prefix {
        ""      "";
        default $http_x_ingress_path;
    }

    server {
        listen 4243;

        # --- Contrôles de Kanzo, AVANT de réécrire Host/Origin --------------
        # Host : localhost, nom du conteneur ou adresse IP (le DNS-rebinding
        # attaque par nom de domaine) — sauf requête Ingress de confiance.
        set $deny "host";
        if ($host ~* "^localhost$") { set $deny ""; }
        if ($host ~* "^$hostname$") { set $deny ""; }
        if ($host ~* "^$hostname\.local$") { set $deny ""; }
        if ($host ~* "^([0-9]{1,3}\.){3}[0-9]{1,3}$") { set $deny ""; }
        if ($host ~* "^\[[0-9a-f:]+\]$") { set $deny ""; }
        if ($http_x_ingress_path != "") { set $deny ""; }
        if ($deny != "") { return 403 "kanzo does not answer requests from other sites"; }

        # Origin : absent (client non-navigateur, ex. MCP) ou identique au
        # Host envoyé — c'est le contrôle CSRF de Kanzo avant réécriture.
        set $deny "origin";
        if ($http_origin = "") { set $deny ""; }
        if ($http_origin = "http://$http_host") { set $deny ""; }
        if ($http_origin = "https://$http_host") { set $deny ""; }
        if ($http_x_ingress_path != "") { set $deny ""; }
        if ($deny != "") { return 403 "kanzo does not answer requests from other sites"; }

        # --- Vers Kanzo -----------------------------------------------------
        proxy_http_version 1.1;
        # Kanzo exige Host en port 4242 et Origin == http://<Host>.
        proxy_set_header Host localhost:4242;
        proxy_set_header Origin http://localhost:4242;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # Réponses non compressées pour que sub_filter puisse les réécrire.
        proxy_set_header Accept-Encoding "";

        # sync git et mise à jour peuvent être longs.
        proxy_read_timeout 300s;

        # Kanzo n'autorise que l'ordinateur qui porte le board (loopback) à
        # gérer le réseau ; derrière nginx tout client semble en loopback.
        # Seule l'Ingress (authentifiée par HA) a donc le droit d'y accéder.
        location = /api/network {
            if ($http_x_ingress_path = "") { return 403 "only the computer with the board can change its network"; }
            proxy_pass http://127.0.0.1:4242;
        }

        location / {
            proxy_pass http://127.0.0.1:4242;
        }

        # --- Réécriture des URLs absolues pour l'Ingress ---------------------
        # index.html : src/href="/logo.png", src="/app.js" ;
        # app.js : fetch("/api"...), `/api/tasks/...`, `/images/...`.
        # Sous l'Ingress le navigateur doit demander /<préfixe>/... ; hors
        # Ingress $ingress_prefix est vide et les URLs restent telles quelles.
        # text/html est déjà le type par défaut de sub_filter (le lister
        # explicitement déclenche un warn "duplicate MIME type").
        sub_filter_types text/javascript application/javascript;
        sub_filter_once off;
        sub_filter '"/api' '"$ingress_prefix/api';
        sub_filter '`/api' '`$ingress_prefix/api';
        sub_filter '`/images/' '`$ingress_prefix/images/';
        sub_filter '="/' '="$ingress_prefix/';
    }
}
