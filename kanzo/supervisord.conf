[supervisord]
user=root
nodaemon=true
loglevel=info
logfile_maxbytes=0
logfile_backups=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=unexpected
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=root

[program:kanzo]
command=/usr/local/bin/kanzo-entrypoint.sh
autorestart=unexpected
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=root
