name: YouTube-DL
version: "26.9.2"
slug: youtube-dl
panel_icon: "mdi:youtube"
description: Téléchargeur de vidéos YouTube et autres sites (yt-dlp) avec interface web
url: https://github.com/LeGitHubDeTai/ha_addons/tree/main/youtube-dl
webui: http://[HOST]:[PORT:5000]/
image: ghcr.io/legithubdetai/ha_addons/youtube-dl-{arch}
arch:
    - amd64
    - aarch64
startup: application
boot: auto
hassio_role: "default"
hassio_api: true
homeassistant_api: true
apparmor: true
ingress: true
ingress_port: 5000
ingress_stream: true
backup_exclude:
    - "youtube-dl/.yt-dlp"
    - "youtube-dl/downloads"
map:
    - ssl:ro
    - backup:rw
    - share:rw
    - media:rw
    - config:rw
ports:
    5000/tcp: 5000
ports_description:
    5000/tcp: Interface web YouTube-DL. Ingress recommandé, exposition optionnelle.
options:
    timezone: "Europe/Berlin"
    download_folder: /media/youtube-dl
    config_folder: /share/youtube-dl
    max_parallel: 3
    env_vars_list: []
schema:
    timezone: str
    download_folder: match(/share/.+|/media/.+|(smb|nfs)://.+)
    config_folder: match(/share/.+|/media/.+|(smb|nfs)://.+)
    max_parallel: int
    env_vars_list: [
      "match(^[A-Z_0-9]+: .*$)"
    ]