worker_processes 1;
error_log /dev/stdout info;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # sub_filter rewrites responses: plain text only, no gzip
    gzip off;

    server {
        listen 6701;
        server_name _;

        location / {
            proxy_pass http://127.0.0.1:6700;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Plain text only so sub_filter can rewrite JS/HTML
            proxy_set_header Accept-Encoding "";

            # SSE support (execution logs/events streams)
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding off;

            # CTFREAK builds its API/SSE base URL from window.location.origin
            # only, which drops the /hassio_ingress/<token>/ prefix -> 404.
            # Rewrite it to include the path prefix (everything except the
            # last route segment). No $ in the replacement: nginx would parse
            # it as a variable.
            sub_filter_types application/javascript text/javascript;
            sub_filter_once off;
            sub_filter 'window.location.origin' 'window.location.origin+window.location.pathname.split("/").slice(0,-1).join("/")';
        }
    }
}
