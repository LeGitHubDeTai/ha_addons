[supervisord]
user=root
nodaemon=true
loglevel=info
logfile_maxbytes=0
logfile_backups=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=unexpected
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
user=root

[program:ctfreak]
command=/usr/local/bin/ctfreak-entrypoint.sh
autorestart=unexpected
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
user=root
